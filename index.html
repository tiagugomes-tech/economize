/* ---------- armazenamento ---------- */
const LS = 'livrocaixa.v1';
const Store = {
  db: null, col: null, cfgTimer: null, chain: {}, unsub: null,
  async init() {
    let db = null, user = null;
    try {
      if (window.claude && claude.use) [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    } catch (e) { db = null; }
    let id = null;
    try { id = user ? await user.id() : null; } catch (e) { id = null; }
    if (db && id) {
      S.mode = 'conta';
      this.db = db;
      this.col = db.collection('data/users/' + id);
      const timer = setTimeout(() => { if (!S.loaded) { S.stale = true; render(); } }, 10000);
      this.unsub = this.col.onSnapshot((snap) => {
        const next = EMPTY();
        for (const d of snap.docs) {
          const v = d.data();
          if (!v) continue;
          if (d.id === 'cfg') next.cfg = { cards: [], bills: [], rules: {}, paid: {}, ...clone(v) };
          else if (d.id.startsWith('f-')) next.faturas[d.id] = clone(v);
        }
        if (!snap.metadata.fromCache) { clearTimeout(timer); S.stale = false; }
        // não deixa uma cópia antiga do servidor apagar mudanças locais ainda não gravadas
        if (Store.cfgDirty && S.loaded) next.cfg = S.data.cfg;
        if (migrate(next) | healCards(next)) Store.saveCfg(next.cfg);
        const same = JSON.stringify(next) === JSON.stringify(S.data);
        S.data = next;
        const first = !S.loaded;
        S.loaded = true;
        if (!same || first) render();
      }, (err) => {
        clearTimeout(timer);
        S.stale = true; S.loaded = true;
        toast('Não consegui falar com o armazenamento da sua conta. Recarregue a página mais tarde.');
        render();
      });
    } else {
      // fora do Claude: contas no próprio aparelho, dados criptografados com a senha de cada pessoa
      S.mode = 'contas';
      try { const raw = localStorage.getItem(LS); if (raw) S.legacy = JSON.parse(raw); } catch (e) {}
      S.loaded = true;
      S.locked = true;
      render();
      Keep.restore();
    }
  },
  cfgDirty: false,
  saveCfg() {
    if (S.example) return;
    if (S.mode !== 'conta') return this.saveLocal();
    this.cfgDirty = true;
    clearTimeout(this.cfgTimer);
    this.cfgTimer = setTimeout(() => {
      const p = this.write('cfg', clone(S.data.cfg));
      p.finally(() => { if (this.chain.cfg === p) this.cfgDirty = false; });
    }, 450);
  },
  saveFatura(f) {
    if (S.mode !== 'conta') return this.saveLocal();
    return this.write(f.id, clone(f));
  },
  removeFatura(id) {
    if (S.mode !== 'conta') return this.saveLocal();
    this.chain[id] = (this.chain[id] || Promise.resolve()).then(() => this.col.doc(id).delete()).catch(onWriteError);
  },
  write(id, body) {
    this.chain[id] = (this.chain[id] || Promise.resolve()).then(() => this.col.doc(id).set(body)).catch(onWriteError);
    return this.chain[id];
  },
  encTimer: null,
  saveLocal() {
    if (S.mode === 'contas') {
      if (!S.session) return;
      clearTimeout(this.encTimer);
      const sess = S.session;
      this.encTimer = setTimeout(async () => {
        try { localStorage.setItem(Acc.dataKey(sess.u), JSON.stringify(await Acc.enc(sess.key, S.data))); }
        catch (e) { toast('Não deu para salvar neste navegador. Verifique o espaço livre ou se não está em aba anônima.'); }
      }, 300);
      return;
    }
    try { localStorage.setItem(LS, JSON.stringify(S.data)); }
    catch (e) { toast('Não deu para salvar neste navegador. Verifique se ele não está em modo anônimo.'); }
  },
};
function onWriteError(e) {
  const c = e && e.code;
  if (c === 'quota_exceeded') toast('O espaço de armazenamento encheu. Apague faturas antigas em Cadastro → Seus dados.');
  else if (c === 'invalid_argument') toast('Não foi possível salvar: o registro ficou grande demais ou inválido.');
  else toast('Não consegui salvar agora. Tente de novo em instantes.');
}
/* recria cartões que ficaram sem cadastro (faturas importadas cujo cartão não foi salvo) */
function healCards(data) {
  let changed = false;
  for (const f of Object.values(data.faturas)) {
    if (data.cfg.cards.some((c) => c.id === f.cardId)) continue;
    data.cfg.cards.push({ id: f.cardId, banco: f.banco, nome: '', final: f.final || '', fech: f.proxFech ? +f.proxFech.slice(8) : null, venc: +f.venc.slice(8), limite: f.limite || null });
    changed = true;
  }
  return changed;
}
const hasData = () => S.data.cfg.cards.length || S.data.cfg.bills.length || (S.data.cfg.incomes || []).length || Object.keys(S.data.faturas).length;

function leaveExample() {
  if (!S.example) return;
  S.example = false;
}

/* ---------- PDF ---------- */
let pdfReady = null;
function loadScript(src) {
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('script')); document.head.appendChild(s); });
}
function loadPdf() {
  if (!pdfReady) {
    pdfReady = loadScript(PDFJS).then(() => loadScript(PDFWORKER)).then(() => {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFWORKER;
      return window.pdfjsLib;
    });
    pdfReady.catch(() => { pdfReady = null; });
  }
  return pdfReady;
}

async function readPdf(buf, password) {
  const lib = await loadPdf();
  const doc = await lib.getDocument({ data: new Uint8Array(buf), password: password || undefined, isEvalSupported: false }).promise;
  const pages = [];
  for (let p = 1; p <= doc.numPages; p++) {
    const page = await doc.getPage(p);
    const tc = await page.getTextContent();
    pages.push({ items: tc.items, width: page.getViewport({ scale: 1 }).width });
  }
  return pages;
}

let pending = null; // {name, buf}
let lastLines = null;
async function importFile(file) {
  if (!file) return;
  if (/\.csv$/i.test(file.name) || /csv$/i.test(file.type)) { await importCsv(file); return; }
  if (!/pdf$/i.test(file.type) && !/\.pdf$/i.test(file.name)) { toast('Esse arquivo não é PDF nem CSV. Baixe a fatura em PDF (ou CSV, no caso da XP e do Nubank) no app do banco.'); return; }
  const buf = await file.arrayBuffer();
  pending = { name: file.name, buf };
  S.pwd = null;
  await runImport();
}

async function importCsv(file) {
  const buf = await file.arrayBuffer();
  let text = new TextDecoder('utf-8').decode(buf);
  if (text.includes('\ufffd')) text = new TextDecoder('windows-1252').decode(buf);
  pending = { name: file.name, buf: null };
  S.pwd = null;
  const r = Parser.parseCsv(text, file.name);
  lastLines = r.lines;
  if (!r.ok) { S.importErr = { msg: r.erro, banco: r.banco }; render(); return; }
  S.importErr = null;
  leaveExample();
  decideImport(r, file.name);
}

async function runImport(password) {
  if (!pending) return;
  S.importing = true; render();
  let pages;
  try {
    pages = await readPdf(pending.buf.slice(0), password);
  } catch (e) {
    S.importing = false;
    if (e && e.name === 'PasswordException') {
      S.pwd = { wrong: e.code === 2 };
      render();
      setTimeout(() => $('#pdfpwd')?.focus(), 30);
      return;
    }
    toast(e && e.message === 'script' ? 'Não consegui carregar o leitor de PDF. Confira sua internet e tente de novo.' : 'Não consegui abrir esse PDF. Ele pode estar corrompido.');
    render();
    return;
  }
  S.pwd = null;
  const r = Parser.parse(pages);
  lastLines = r.lines;
  S.importing = false;
  if (!r.ok) {
    S.importErr = { msg: r.erro, banco: r.banco };
    render();
    return;
  }
  S.importErr = null;
  leaveExample();
  decideImport(r, pending ? pending.name : '');
}
const sugNome = (r) => (r.titular ? (/^\d{2}\.\d{3}\.\d{3}/.test(r.titular) ? `${BANCOS[r.banco] || 'Cartão'} Empresas` : `${BANCOS[r.banco] || 'Cartão'} · ${r.titular.toLowerCase().replace(/(^|\s)\S/g, (x) => x.toUpperCase()).slice(0, 24)}`) : '');
function importConta(r) {
  const refM = r.venc.slice(0, 7);
  let b = bills().find((x) => x.fonte === r.banco && x.chave === r.chave);
  const novo = !b;
  if (!b) { b = { id: 'b' + uid(), nome: r.nome, valor: r.total, dia: +r.venc.slice(8), cat: 'contas', cartao: '', inicio: refM, fim: '', variavel: true, fonte: r.banco, chave: r.chave, valores: {} }; bills().push(b); }
  b.valores = b.valores || {};
  b.valores[refM] = { valor: r.total, venc: r.venc };
  const ult = Object.keys(b.valores).sort().pop();
  b.valor = b.valores[ult].valor; b.dia = +b.valores[ult].venc.slice(8);
  if (!b.inicio || b.inicio > refM) b.inicio = refM;
  Store.saveCfg();
  S.month = refM; S.view = 'calendario';
  toast(`${novo ? 'Conta criada: ' : 'Conta atualizada: '}${b.nome}, vence em ${dBR(r.venc)}, ${brl(r.total)}. Veja no calendário e marque "Paguei" quando quitar.`);
  render();
}
function decideImport(r, name) {
  if (r.conta) { importConta(r); return; }
  const cfg = S.data.cfg;
  // versões antigas guardavam o CNPJ do próprio Nubank como identificação: vale para todos os cartões, então não identifica ninguém
  for (const c of cfg.cards) if (c.ident === 'CNPJ18236120000158') delete c.ident;
  const cands = cfg.cards.filter((c) => c.banco === r.banco && (r.final ? c.final === r.final : !c.final));
  const jaTem = (c) => S.data.faturas[faturaId(c, r)];
  const igual = (f) => f && Math.abs((f.total ?? 0) - (r.total ?? 0)) < 0.005 && f.tx.length === r.tx.length;
  if (r.ident && !r.final) {
    // reconhece o titular: mesma pessoa/empresa cai no mesmo cartão, outra pessoa/empresa vira outro cartão
    const mesmo = cands.filter((c) => c.ident === r.ident);
    if (mesmo.length === 1) { placeFatura(r, name, mesmo[0], false); return; }
    if (cands.length && cands.every((c) => c.ident && c.ident !== r.ident)) {
      // titular diferente do(s) cartão(ões) guardado(s): pode ser outra pessoa/empresa ou só a leitura do nome que mudou. Pergunta.
      S.choose = { r, name, ids: cands.map((c) => c.id), nome: sugNome(r) };
      pending = null;
      render();
      return;
    }
  }
  // sem como saber de quem é: pergunta quando há mais de uma conta, quando já existe outra fatura nesse vencimento, ou quando o cartão guardado é antigo e ainda não tem titular
  const semTitular = r.ident && !r.final && cands.some((c) => !c.ident && fatOfCard(c.id).length);
  const duvida = !r.final && (cands.length > 1 || semTitular || (cands.length === 1 && jaTem(cands[0]) && !igual(jaTem(cands[0]))));
  if (duvida) {
    S.choose = { r, name, ids: cands.map((c) => c.id), nome: sugNome(r) };
    pending = null;
    render();
    return;
  }
  placeFatura(r, name, cands[0] || null, false);
}
const faturaId = (card, r) => (card.alt ? `f-${r.banco}-${r.final || 'x'}-${card.id}-${r.venc}` : `f-${r.banco}-${r.final || 'x'}-${r.venc}`);
function placeFatura(r, name, card, outra, nomeNovo) {
  const cfg = S.data.cfg;
  if (!card) {
    card = { id: 'c' + uid(), banco: r.banco, nome: nomeNovo || '', final: r.final || '', fech: r.proxFech ? +r.proxFech.slice(8) : null, venc: +r.venc.slice(8), limite: r.limite };
    if (outra) card.alt = true;
    if (r.ident) card.ident = r.ident;
    cfg.cards.push(card);
  } else {
    if (!card.venc) card.venc = +r.venc.slice(8);
    if (!card.fech && r.proxFech) card.fech = +r.proxFech.slice(8);
    if (r.limite) card.limite = r.limite;
    if (r.ident && !card.ident && !r.final) card.ident = r.ident;
  }
  const id = faturaId(card, r);
  const replaced = !!S.data.faturas[id];
  const f = {
    id, cardId: card.id, banco: r.banco, final: r.final, venc: r.venc, proxFech: r.proxFech, emissao: r.emissao,
    total: r.total, soma: r.soma, limite: r.limite, totalLanc: r.totalLanc, totalFuturo: r.totalFuturo, encargos: r.encargos || 0, encargosItens: r.encargosItens || [],
    conferido: r.conferido, futuroConferido: r.futuroConferido, generico: r.generico, csv: !!r.csv,
    tx: r.tx, pags: r.pags, futuro: r.futuro || [], futuroK: r.futuroK || null, importedAt: new Date().toISOString(), arquivo: name,
  };
  S.data.faturas[id] = f;
  pending = null;
  Store.saveCfg();
  Store.saveFatura(f);
  S.fatId = id;
  S.view = 'faturas';
  location.hash = 'faturas';
  const n = f.tx.length;
  toast(`${replaced ? 'Fatura atualizada' : 'Fatura importada'}: ${n} lançamento${n > 1 ? 's' : ''}${f.conferido ? ', soma confere com o banco' : ''}.`);
  render();
}

/* ---------- IA ---------- */
async function aiCategorize() {
  const f = S.data.faturas[S.fatId] || D().faturas[S.fatId];
  if (!f || !S.ai.fn || S.ai.busy) return;
  const seen = new Map();
  for (const t of f.tx) {
    const c = categorize(t);
    if (c.src === 'voce') continue;
    if (c.cat === 'outros' || c.cat === 'servicos' || c.src === 'banco') seen.set(mkey(t.desc), { nome: t.desc, dica: t.hint || '' });
  }
  if (!seen.size) { toast('Todos os lançamentos já têm categoria.'); return; }
  S.ai.busy = true; render();
  const lista = [...seen.entries()].map(([k, v]) => ({ chave: k, estabelecimento: v.nome, dica_do_banco: v.dica }));
  const prompt = `Você classifica lançamentos de fatura de cartão de crédito no Brasil.\nCategorias permitidas (use só o id): ${CATS.map(([id, n]) => `${id} = ${n}`).join('; ')}.\nPara cada item, escolha a categoria mais provável a partir do nome do estabelecimento (e da dica do banco, quando houver). Se for nome de pessoa sem pista, use "servicos". Se não der para saber, use "outros".\nResponda apenas com JSON no formato {"<chave>": "<id da categoria>"}.\n\nItens:\n${JSON.stringify(lista)}`;
  try {
    const res = await S.ai.fn.json(prompt, { modelTier: 'quick' });
    let n = 0;
    for (const [k, c] of Object.entries(res || {})) {
      if (seen.has(k) && CAT[c] && c !== categorize({ desc: seen.get(k).nome, hint: seen.get(k).dica }).cat) { D().cfg.rules[k] = { cat: c, src: 'ia' }; n++; }
    }
    Store.saveCfg();
    toast(n ? `A IA sugeriu categoria para ${n} estabelecimento${n > 1 ? 's' : ''}. Confira e ajuste se precisar.` : 'A IA manteve as categorias atuais.');
  } catch (e) {
    if (e && e.code === 'not_granted') { S.ai.fn = null; toast('Tudo bem, as sugestões por IA ficam desligadas nesta visita.'); }
    else if (e && e.code === 'rate_limited') toast('Muitos pedidos seguidos. Espere um pouco e tente de novo.');
    else toast('Não consegui as sugestões agora. Tente de novo mais tarde.');
  }
  S.ai.busy = false; render();
}

const GRUPOS = [

];
const GRUPO_DE = {};
for (const [id, nome, cor, cats] of GRUPOS) for (const c of cats) { GRUPO_DE[c] = id; CAT[c].cor = cor; }
const GRUPO = Object.fromEntries(GRUPOS.map(([id, nome, cor, cats]) => [id, { id, nome, cor, cats }]));

/* ---------- entradas ---------- */
const INC_CATS = { salario: 'Salário', extra: 'Renda extra', beneficio: 'Benefício', reembolso: 'Reembolso', outros: 'Outros' };
const incomes = () => D().cfg.incomes || (D().cfg.incomes = []);
const avulsas = () => D().cfg.entradas || (D().cfg.entradas = []);
const recebidoMap = () => D().cfg.recebido || (D().cfg.recebido = {});
function incomesOf(M) {
  const out = [];
  for (const i of incomes()) {
    if (!billActive(i, M)) continue;
    const key = `i:${i.id}:${M}`;
    const rec = recebidoMap()[key];
    out.push({ key, kind: 'fixa', id: i.id, nome: i.nome, cat: i.cat, valor: +i.valor || 0, date: dayIn(M, i.dia), recebido: !!rec, recebidoEm: typeof rec === 'string' ? rec : null });
  }
  for (const a of avulsas()) if ((a.data || '').slice(0, 7) === M) out.push({ key: `a:${a.id}`, kind: 'avulsa', id: a.id, nome: a.nome, cat: a.cat, valor: +a.valor || 0, date: a.data, recebido: true, recebidoEm: a.data });
  return out.sort((a, b) => (a.date < b.date ? -1 : 1));
}
const sumV = (arr, f = (x) => x.valor) => r2(arr.reduce((s, x) => s + (f(x) || 0), 0));
const fixedIncome = (M) => sumV(incomes().filter((i) => billActive(i, M)), (i) => +i.valor);

/* ---------- parcelamentos ativos (a partir da fatura mais recente de cada cartão) ---------- */
function parcelamentos() {
  const out = [];
  for (const c of cards()) {
    const f = fatOfCard(c.id)[0];
    if (!f) continue;
    const base = f.venc.slice(0, 7);
    const fut = Parser.projectFuture(f);
    const map = new Map();
    for (const p of fut) {
      const k = p.desc + '|' + p.v;
      let g = map.get(k);
      if (!g) { g = { desc: p.desc, v: p.v, card: c, ent: [], tot: null }; map.set(k, g); }
      g.ent.push(p);
      if (p.parc) g.tot = p.parc[1];
    }
    for (const g of map.values()) {
      const minK = Math.min(...g.ent.map((e) => e.k));
      const qtd = g.ent.filter((e) => e.k === minK).length;
      const rest = Math.round(g.ent.length / qtd);
      const maxK = Math.max(...g.ent.map((e) => e.k));
      const fim = addM(base, maxK);
      const prox = addM(base, minK);
      // parcelas antigas que ainda não chegaram ao mês atual não contam
      if (fim < CUR) continue;
      out.push({ desc: g.desc, v: g.v, qtd, rest, tot: g.tot, card: c, fim, prox, restante: r2(g.v * qtd * rest), mensal: r2(g.v * qtd) });
    }
  }
  return out.sort((a, b) => b.restante - a.restante);
}

/* ---------- gráficos ---------- */
function donut(parts, total, center) {
  const R = 78, C = 2 * Math.PI * R, gap = parts.length > 1 ? 2.2 : 0;
  let acc = 0;
  const segs = parts.map((p) => {
    const len = (p.v / total) * C;
    const s = `<circle class="seg ${S.grpFilter === p.id ? 'on' : ''} ${S.grpFilter && S.grpFilter !== p.id ? 'dim' : ''}" cx="100" cy="100" r="${R}" fill="none" stroke="${p.cor}" stroke-width="26"
      stroke-dasharray="${Math.max(0.01, len - gap).toFixed(2)} ${(C - Math.max(0.01, len - gap)).toFixed(2)}" stroke-dashoffset="${(-acc).toFixed(2)}"
      data-act="grp" data-grp="${p.id}" tabindex="0" role="button" aria-label="${esc(p.nome)}: ${brl(p.v)}"><title>${esc(p.nome)} · ${brl(p.v)} · ${Math.round((p.v / total) * 100)}%</title></circle>`;
    acc += len;
    return s;
  }).join('');
  return `<svg class="donut" viewBox="0 0 200 200" role="img" aria-label="Divisão das saídas por grupo">
    <circle cx="100" cy="100" r="${R}" fill="none" stroke="var(--rule)" stroke-width="26"/>
    <g transform="rotate(-90 100 100)">${segs}</g>
    <text x="100" y="94" text-anchor="middle" class="d-lbl">${esc(center[0])}</text>
    <text x="100" y="118" text-anchor="middle" class="d-val">${esc(center[1])}</text>
  </svg>`;
}

/* ---------- resumo ---------- */
function viewResumo() {
  if (!hasData()) return viewEmpty();
  const M = S.month;
  const sp = spendingOf(M);
  const inc = incomesOf(M);
  const entradas = sumV(inc);
  const recebido = sumV(inc.filter((i) => i.recebido));
  const saidas = sp.total;
  const sobra = r2(entradas - saidas);
  const ev = eventsOf(M);
  const aPagar = r2(ev.filter((e) => !e.pago && e.valor).reduce((s, e) => s + e.valor, 0));
  const prevSp = spendingOf(addM(M, -1));
  const pct = entradas > 0 ? Math.round((saidas / entradas) * 100) : null;
  const gaugeCls = pct == null ? '' : pct > 100 ? 'bad' : pct >= 85 ? 'warn' : 'ok';

  // grupos
  const byG = {};
  for (const [c, v] of Object.entries(sp.byCat)) { const g = GRUPO_DE[c] || 'outros'; byG[g] = r2((byG[g] || 0) + v); }
  const parts = GRUPOS.filter(([id]) => byG[id] > 0).map(([id, nome, cor]) => ({ id, nome, cor, v: byG[id] }));
  const gsel = S.grpFilter && byG[S.grpFilter] ? GRUPO[S.grpFilter] : null;

  // insights
  const pcs = parcelamentos();
  const nParc = pcs.reduce((s, p) => s + p.qtd, 0);
  const proxMes = addM(CUR, 1);
  const mensalProx = r2(pcs.filter((p) => p.prox <= proxMes).reduce((s, p) => s + p.mensal, 0));
  const livre = pcs.reduce((m, p) => (p.fim > m ? p.fim : m), '');
  const restanteTot = r2(pcs.reduce((s, p) => s + p.restante, 0));
  const pixTot = sumV(sp.tx.filter((t) => t.cat === 'pix'), (t) => t.v);
  const pixJuros = sumV(sp.tx, (t) => t.juros || 0);
  const custoCredito = r2(sp.juros);
  const porCartao = {};
  for (const t of sp.tx) { const id = t.fat.cardId; porCartao[id] = r2((porCartao[id] || 0) + t.v); }
  const cartoes = Object.entries(porCartao).sort((a, b) => b[1] - a[1]);
  const maxCartao = cartoes.length ? cartoes[0][1] : 1;

  // comprometido
  const serie = [];
  const endM = livre && livre > M ? livre : M;
  for (let m = M; m <= endM && serie.length < 36; m = addM(m, 1)) serie.push({ m, v: committed(m).parc });
  while (serie.length > 1 && serie[serie.length - 1].v <= 0) serie.pop();
  const maxS = Math.max(1, ...serie.map((x) => x.v));
  const ends = {};
  for (const p of pcs) if (p.fim >= M) (ends[p.fim] ||= []).push(p);
  // compras cuja última parcela está nas faturas deste mês
  for (const f of allFat()) if (f.venc.slice(0, 7) === M) for (const t of f.tx) if (t.parc && t.parc[0] === t.parc[1]) (ends[M] ||= []).push({ desc: t.desc, qtd: 1, mensal: t.v });

  const prox = eventsOf(M).concat(eventsOf(addM(M, 1))).filter((e) => !e.pago && (e.status === 'atrasado' || e.date >= (M === CUR ? TODAY : `${M}-01`))).slice(0, 5);
  const lista = [...sp.tx, ...sp.bl].filter((t) => !gsel || gsel.cats.includes(t.cat)).sort((a, b) => b.v - a.v);
  const shown = gsel || S.showAll ? lista : lista.slice(0, 6);
  const deltaPct = prevSp.total > 0 && saidas > 0 ? Math.round(((saidas - prevSp.total) / prevSp.total) * 100) : null;

  return `<section class="dash">
    ${heroCard({ M, entradas, recebido, saidas, sobra, aPagar, pct, gaugeCls, deltaPct, sp, ev, parcMes: committed(M).parc })}
    ${alertBanner()}
    ${dicasCard({ M, entradas, saidas, sp, prevSp, pcs })}
    ${passosCard(false)}
      ${sp.missing.length ? `<div class="panel"><div class="note">Falta a fatura de ${sp.missing.map((c) => `<strong>${esc(cardName(c))}</strong>`).join(', ')} neste mês. <button class="link" data-act="goimport">Importar</button></div></div>` : ''}

    <div class="row-2">
      <div class="panel">
        <div class="panel-h"><h2>Para onde foi</h2>${gsel ? '<button class="link" data-act="grpclear">Ver tudo</button>' : '<span class="muted">toque numa fatia</span>'}</div>
        ${parts.length ? `<div class="donut-wrap">
          ${donut(parts, saidas, gsel ? [gsel.nome, brl(byG[gsel.id])] : ['Saídas', brl(saidas)])}
          <ul class="legend-l">${parts.map((p) => `<li><button class="lg-row ${S.grpFilter === p.id ? 'on' : ''}" data-act="grp" data-grp="${p.id}"><i class="sw" style="background:${p.cor}"></i><span class="lg-n">${esc(p.nome)}</span><span class="lg-v money">${brl(p.v)}</span><span class="lg-p">${Math.round((p.v / saidas) * 100)}%</span></button></li>`).join('')}</ul>
        </div>` : `<div class="empty">Nenhuma saída em ${esc(mesNome(M))}.</div>`}
      </div>

      <div class="insights">
        <div class="tile">
          <span class="tile-ic">${iconSvg('parc')}</span>
          <span class="lbl">Parcelamentos ativos</span>
          <span class="tile-v">${nParc}</span>
          <span class="tile-s">${nParc ? `${brl(mensalProx)} em ${MES3[+proxMes.slice(5) - 1]} · última em ${mesCurto(livre)}` : 'nenhuma compra parcelada'}</span>
        </div>
        <div class="tile">
          <span class="tile-ic warn">${iconSvg('juros')}</span>
          <span class="lbl">Juros, encargos e tarifas</span>
          <span class="tile-v money ${custoCredito > 0 ? 'neg' : ''}">${brl(custoCredito)}</span>
          <span class="tile-s">${custoCredito > 0 ? `${entradas ? `${((custoCredito / entradas) * 100).toFixed(1).replace('.', ',')}% da renda ` : ''}pago ao banco no mês` : 'nada pago ao banco'}</span>
        </div>
        <div class="tile">
          <span class="tile-ic">${iconSvg('pix')}</span>
          <span class="lbl">Pix no crédito</span>
          <span class="tile-v money">${brl(pixTot)}</span>
          <span class="tile-s">${pixTot ? `${Math.round((pixTot / saidas) * 100)}% das saídas · ${brl(pixJuros)} de juros` : 'nenhum no mês'}</span>
        </div>
        <div class="tile">
          <span class="tile-ic">${iconSvg('card')}</span>
          <span class="lbl">Cartão que mais pesou</span>
          <span class="tile-v sm">${cartoes.length ? esc(cardName(cardById(cartoes[0][0]))) : '—'}</span>
          <span class="tile-s">${cartoes.length ? `${brl(cartoes[0][1])} · ${Math.round((cartoes[0][1] / (sp.totTx || 1)) * 100)}% do gasto nos cartões` : 'sem faturas no mês'}</span>
        </div>
      </div>
    </div>

    <div class="panel parc-chart">
      <div class="panel-h"><h2>Parcelas por mês</h2><span class="muted">${serie.length > 1 ? `de ${mesCurto(serie[0].m)} até ${mesCurto(serie[serie.length - 1].m)}` : ''}</span></div>
      ${serie.some((x) => x.v > 0) ? `
      <div class="pc-sum">
        <div><span class="lbl">Em ${esc(MES3[+M.slice(5) - 1])}</span><span class="money pc-big">${brl(serie[0].v)}</span>${entradas ? `<small>${Math.round((serie[0].v / entradas) * 100)}% das entradas</small>` : ''}</div>
        <div><span class="lbl">Soma de ${esc(MES3[+M.slice(5) - 1])} até o fim</span><span class="money pc-big">${brl(r2(serie.reduce((s2, x) => s2 + x.v, 0)))}</span><small>${serie.length} meses</small></div>
        <div><span class="lbl">Livre das parcelas em</span><span class="pc-big">${esc(mesCurto(addM(serie[serie.length - 1].m, 1)))}</span><small>se não parcelar mais nada</small></div>
      </div>
      <div class="pc-scroll"><div class="pc-chart" style="grid-template-columns:repeat(${serie.length}, minmax(46px, 1fr))" role="img" aria-label="Total de parcelas por mês, de ${esc(mesNome(serie[0].m))} até ${esc(mesNome(serie[serie.length - 1].m))}">
        ${serie.map((x, i) => {
          const drop = i ? r2(serie[i - 1].v - x.v) : 0;
          const acaba = (ends[x.m] || []).map((p) => p.desc + (p.qtd > 1 ? ` (${p.qtd}×)` : '')).join(', ');
          return `<div class="pc-col ${i === 0 ? 'now' : ''}" title="${esc(mesNome(x.m))}: ${brl(x.v)} em parcelas${acaba ? ` · última parcela de ${esc(acaba)}` : ''}">
            <span class="pc-v">${x.v >= 1000 ? (x.v / 1000).toFixed(1).replace('.', ',') + ' mil' : Math.round(x.v)}</span>
            <span class="pc-bar"><span style="height:${Math.max(1.5, (x.v / maxS) * 100).toFixed(1)}%"></span></span>
            <span class="pc-m">${mesCurto(x.m)}</span>
            <span class="pc-d">${drop > 1 ? '−' + Math.round(drop) : ''}</span>
          </div>`; }).join('')}
      </div></div>
      <div class="legend"><span><i class="sw" style="background:var(--accent)"></i>Total de parcelas no mês</span><span><b class="pos">−valor</b> quanto a conta cai em relação ao mês anterior</span></div>
      ${Object.keys(ends).length ? `<div class="pc-ends"><div class="lbl">Quando cada uma acaba</div><ul>${Object.keys(ends).sort().map((m) => `<li><span class="pe-m">${esc(mesCurto(m))}</span><span class="pe-n">${ends[m].map((p) => esc(p.desc) + (p.qtd > 1 ? ` <span class="tag">${p.qtd}×</span>` : '')).join(', ')}</span><span class="pe-v money pos">−${brl(r2(ends[m].reduce((s2, p) => s2 + p.mensal, 0)))}/mês</span></li>`).join('')}</ul></div>` : ''}`
      : '<div class="empty">Nenhuma parcela nas faturas importadas.</div>'}
    </div>

    <div class="row-2">
      <div class="panel">
        <div class="panel-h"><h2>Parcelamentos</h2><span class="muted">${nParc ? `${brl(restanteTot)} a pagar` : ''}</span></div>
        ${pcs.length ? `<ul class="parc-list">${pcs.slice(0, S.showParc ? 99 : 6).map((p) => {
          const pagas = p.tot ? p.tot - p.rest : null;
          return `<li>
            <div class="pl-top"><span class="pl-n">${esc(p.desc)}${p.qtd > 1 ? ` <span class="tag">${p.qtd}×</span>` : ''}<small>${esc(cardName(p.card))} · termina em ${mesCurto(p.fim)}</small></span><span class="pl-v"><span class="money">${brl(p.mensal)}</span><small>/mês</small></span></div>
            <div class="pl-bar"><span style="width:${p.tot ? ((pagas / p.tot) * 100).toFixed(1) : 0}%"></span></div>
            <div class="pl-meta">${p.tot ? `${pagas} de ${p.tot} pagas · faltam ${p.rest}` : `faltam ${p.rest} parcela${p.rest > 1 ? 's' : ''}`} · ${brl(p.restante)} restantes</div>
          </li>`; }).join('')}</ul>
          ${pcs.length > 6 ? `<button class="link" data-act="toggleparc">${S.showParc ? 'Mostrar menos' : `Ver todos (${pcs.length})`}</button>` : ''}`
          : '<div class="empty">Nenhuma compra parcelada nas faturas importadas.</div>'}
      </div>

      <div class="col-stack">
        <div class="panel">
          <div class="panel-h"><h2>Gasto por cartão</h2><span class="muted">${esc(MES3[+M.slice(5) - 1])}</span></div>
          ${cartoes.length ? `<ul class="cbars">${cartoes.map(([id, v]) => { const c = cardById(id); return `<li><span class="bank b-${esc(c?.banco)} xs">${esc(SIGLA[c?.banco] || '•')}</span><span class="cb-n">${esc(cardName(c))}</span><span class="cb-track"><span style="width:${((v / maxCartao) * 100).toFixed(1)}%"></span></span><span class="cb-v money">${brl(v)}</span></li>`; }).join('')}</ul>` : '<div class="empty">Sem faturas neste mês.</div>'}
        </div>
      </div>
    </div>

    <div class="row-2">
      <div class="panel">
        <div class="panel-h"><h2>${gsel ? esc(gsel.nome) : 'Maiores lançamentos'}</h2><span class="muted">${lista.length} itens</span></div>
        <ul class="ledger">${shown.map((t) => `
          <li><span class="l-date">${t.conta ? 'fixa' : dBR(t.d)}</span>
          <span class="l-desc">${esc(t.desc)}${t.parc ? ` <span class="tag">${t.parc[0]}/${t.parc[1]}</span>` : ''}<small><i class="sw" style="background:${CAT[t.cat].cor}"></i>${esc(CAT[t.cat].nome)} · ${t.conta ? 'Conta fixa' : esc(cardName(cardById(t.fat.cardId)))}</small></span>
          <span class="l-val money">${brl(t.v)}</span></li>`).join('')}</ul>
        ${!gsel && lista.length > 6 ? `<button class="link" data-act="toggleall">${S.showAll ? 'Mostrar menos' : `Ver todos (${lista.length})`}</button>` : ''}
      </div>

      <div class="col-stack">
        <div class="panel">
          <div class="panel-h"><h2>Próximos vencimentos</h2><button class="link" data-nav-to="calendario">Calendário</button></div>
          ${prox.length ? `<ul class="due">${prox.map((e) => `
            <li class="due-${e.status}"><span class="due-d"><b>${e.date.slice(8)}</b>${MES3[+e.date.slice(5, 7) - 1]}</span>
            <span class="due-n">${esc(e.nome)}${e.est ? '<small>estimado pelas parcelas</small>' : ''}</span>
            <span class="due-v money">${brl(e.valor)}</span><span class="due-act">${isPaid(e.key) ? '' : statusPill(e)}${payBtn(e)}</span></li>`).join('')}</ul>`
            : '<div class="empty">Nada em aberto. Tudo pago por aqui.</div>'}
        </div>
        ${(sp.juros > 0) ? `<div class="panel">
          <div class="panel-h"><h2>Pontos de atenção</h2></div>
          <ul class="alerts">
            ${sp.tx.filter((t) => t.encargo).map((t) => `<li><b class="neg">${brl(t.v)} de encargos</b> no ${esc(cardName(cardById(t.fat.cardId)))} (${(t.fat.encargosItens || []).map((e) => `${esc(e.nome.toLowerCase())} ${brl(e.v)}`).join(', ')}). Aparece quando a fatura anterior é paga depois do vencimento.</li>`).join('')}
            ${sp.tx.filter((t) => /multa de atraso|iof de atraso/i.test(t.desc)).length ? `<li><b class="neg">${brl(sumV(sp.tx.filter((t) => /multa de atraso|iof de atraso/i.test(t.desc)), (t) => t.v))} de multa e IOF por atraso</b> no Nubank.</li>` : ''}
            ${pixJuros ? `<li><b class="neg">${brl(pixJuros)} de juros</b> em ${sp.tx.filter((t) => t.juros).length} Pix no crédito.</li>` : ''}
            ${(() => { const an = sp.tx.filter((t) => /anuidade|mensalidade - plano/i.test(t.desc)); return an.length ? `<li><b>${brl(sumV(an, (t) => t.v))} de anuidade</b> em ${an.length} cartão${an.length > 1 ? 'es' : ''}. Vale pedir isenção.</li>` : ''; })()}
          </ul></div>` : ''}
      </div>
    </div>
  </section>`;
}

/* ---------- entradas ---------- */
function viewEntradas() {
  const M = S.month;
  const inc = incomesOf(M);
  const total = sumV(inc), rec = sumV(inc.filter((i) => i.recebido));
  const sp = spendingOf(M);
  const sobra = r2(total - sp.total);
  const E = S.edit;
  const incForm = (d) => `<form class="form" data-form="income">
    ${field('e-nome', 'Nome', d.nome, 'placeholder="Ex.: Salário" required')}
    ${field('e-valor', 'Valor líquido (R$)', d.valor, 'inputmode="decimal" placeholder="0,00" required')}
    ${field('e-dia', 'Dia em que cai', d.dia, 'type="number" min="1" max="31" inputmode="numeric" required')}
    <label class="fld" for="e-cat"><span>Tipo</span><select id="e-cat" data-f="cat">${Object.entries(INC_CATS).map(([k, n]) => `<option value="${k}" ${d.cat === k ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
    ${field('e-inicio', 'Começa em (opcional)', d.inicio, 'type="month"')}
    ${field('e-fim', 'Termina em (opcional)', d.fim, 'type="month"')}
    <div class="form-acts"><button class="btn" type="submit">Salvar entrada</button><button class="btn ghost" type="button" data-act="cancel">Cancelar</button>
    ${d.id ? (S.confirm === 'delinc' ? `<span class="confirm">Apagar esta entrada fixa? <button class="btn bad sm" type="button" data-act="delinc">Apagar</button></span>` : `<button class="link muted" type="button" data-act="askdelinc">Apagar</button>`) : ''}</div></form>`;
  const avForm = (d) => `<form class="form" data-form="avulsa">
    ${field('e-nome', 'Descrição', d.nome, 'placeholder="Ex.: Freela, venda, 13º" required')}
    ${field('e-valor', 'Valor (R$)', d.valor, 'inputmode="decimal" placeholder="0,00" required')}
    ${field('e-data', 'Data', d.data, 'type="date" required')}
    <label class="fld" for="e-cat"><span>Tipo</span><select id="e-cat" data-f="cat">${Object.entries(INC_CATS).map(([k, n]) => `<option value="${k}" ${d.cat === k ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
    <div class="form-acts"><button class="btn" type="submit">Salvar</button><button class="btn ghost" type="button" data-act="cancel">Cancelar</button>
    ${d.id ? (S.confirm === 'delav' ? `<span class="confirm">Apagar? <button class="btn bad sm" type="button" data-act="delav">Apagar</button></span>` : `<button class="link muted" type="button" data-act="askdelav">Apagar</button>`) : ''}</div></form>`;
  const fixas = inc.filter((i) => i.kind === 'fixa'), avs = inc.filter((i) => i.kind === 'avulsa');
  const row = (i) => E && ((E.kind === 'income' && i.kind === 'fixa') || (E.kind === 'avulsa' && i.kind === 'avulsa')) && E.draft.id === i.id
    ? `<li class="editing">${i.kind === 'fixa' ? incForm(E.draft) : avForm(E.draft)}</li>`
    : `<li class="inc ${i.recebido ? 'rec' : ''}">
        <button class="inc-main" data-act="${i.kind === 'fixa' ? 'editinc' : 'editav'}" data-id="${esc(i.id)}">
          <span class="due-d"><b>${i.date.slice(8)}</b>${MES3[+i.date.slice(5, 7) - 1]}</span>
          <span class="item-n">${esc(i.nome)}<small>${esc(INC_CATS[i.cat] || 'Entrada')}${i.kind === 'fixa' ? ' · todo mês' : ' · só neste mês'}</small></span>
          <span class="inc-v money">+${brl(i.valor)}</span>
        </button>
        ${i.kind === 'fixa' ? `<button class="btn sm ${i.recebido ? 'ghost-ok' : 'ghost'}" data-act="receb" data-key="${esc(i.key)}">${i.recebido ? `✓ Recebi${i.recebidoEm ? ' ' + dBR(i.recebidoEm) : ''}` : 'Recebi'}</button>` : ''}
      </li>`;
  return `<section class="stack">
    <div class="panel inc-hero">
      <div><div class="eyebrow">Entradas de ${esc(MESES[+M.slice(5) - 1])}</div><div class="big money pos-ink">${brl(total)}</div>
      <div class="muted">${total ? (rec >= total ? 'Tudo recebido' : `${brl(rec)} recebido · ${brl(r2(total - rec))} a receber`) : 'Nenhuma entrada cadastrada neste mês'}</div></div>
      <div class="inc-sum">
        <div><span class="lbl">Saídas</span><span class="money">${brl(sp.total)}</span></div>
        <div><span class="lbl">${sobra >= 0 ? 'Sobra' : 'Falta'}</span><span class="money ${total ? (sobra >= 0 ? 'pos' : 'neg') : ''}">${total ? brl(Math.abs(sobra)) : '—'}</span></div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-h"><h2>Entradas fixas</h2>${E?.kind === 'income' && !E.draft.id ? '' : '<button class="btn sm" data-act="newinc">Adicionar</button>'}</div>
      <p class="hint-p">O que cai todo mês: salário, benefício, aluguel que você recebe. Use o valor líquido, o que de fato entra na conta.</p>
      ${E?.kind === 'income' && !E.draft.id ? incForm(E.draft) : ''}
      ${fixas.length ? `<ul class="inc-list">${fixas.map(row).join('')}</ul>` : (E?.kind === 'income' ? '' : '<div class="empty">Comece pelo salário: toque em Adicionar.</div>')}
      ${incomes().filter((i) => !billActive(i, M)).length ? `<p class="muted small-note">${incomes().filter((i) => !billActive(i, M)).length} entrada(s) fixa(s) fora do período deste mês.</p>` : ''}
    </div>
    <div class="panel">
      <div class="panel-h"><h2>Entradas avulsas de ${esc(MESES[+M.slice(5) - 1])}</h2>${E?.kind === 'avulsa' && !E.draft.id ? '' : '<button class="btn sm" data-act="newav">Adicionar</button>'}</div>
      <p class="hint-p">Dinheiro que entrou uma vez só: freela, venda, 13º, reembolso, Pix recebido.</p>
      ${E?.kind === 'avulsa' && !E.draft.id ? avForm(E.draft) : ''}
      ${avs.length ? `<ul class="inc-list">${avs.map(row).join('')}</ul>` : (E?.kind === 'avulsa' ? '' : '<div class="empty">Nenhuma entrada avulsa neste mês.</div>')}
    </div>
  </section>`;
}

/* ---------- calendário ---------- */
function viewCalendario() {
  const M = S.month;
  const ev = eventsOf(M);
  const inc = incomesOf(M).map((i) => ({ ...i, entrada: true, status: i.recebido ? 'pago' : 'entrada' }));
  const [y, m] = M.split('-').map(Number);
  const first = new Date(y, m - 1, 1).getDay();
  const days = new Date(y, m, 0).getDate();
  const byDay = {};
  for (const e of [...inc, ...ev]) (byDay[+e.date.slice(8)] ||= []).push(e);
  let cells = '';
  for (let i = 0; i < first; i++) cells += '<div class="cal-c blank"></div>';
  for (let d = 1; d <= days; d++) {
    const iso = `${M}-${pad(d)}`;
    const es = byDay[d] || [];
    const best = cards().filter((c) => c.fech && ((+c.fech % days) + 1) === d);
    cells += `<button class="cal-c ${iso === TODAY ? 'today' : ''} ${S.selDay === d ? 'sel' : ''} ${es.length ? 'has' : ''}" data-act="day" data-day="${d}" aria-label="Dia ${d}${es.length ? `, ${es.length} item${es.length > 1 ? 's' : ''}` : ''}">
      <span class="cal-n">${d}</span>
      ${es.slice(0, 2).map((e) => `<span class="cal-e ${e.entrada ? 's-in' : 's-' + e.status}"><span class="cal-et">${e.entrada ? '+ ' : ''}${esc(e.nome.replace(/^Fatura /, ''))}</span></span>`).join('')}
      ${es.length > 2 ? `<span class="cal-more">+${es.length - 2}</span>` : ''}
      <span class="cal-dots">${es.map((e) => `<i class="${e.entrada ? 's-in' : 's-' + e.status}"></i>`).join('')}</span>
      ${best.length ? `<span class="cal-best" title="Melhor dia de compra: ${esc(best.map(cardName).join(', '))}">★</span>` : ''}
    </button>`;
  }
  const list = [...inc, ...ev].filter((e) => !S.selDay || +e.date.slice(8) === S.selDay).sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : a.entrada ? -1 : 1));
  const saiTot = r2(ev.reduce((s, e) => s + (e.valor || 0), 0));
  const pago = r2(ev.filter((e) => e.pago).reduce((s, e) => s + (e.valor || 0), 0));
  const entTot = sumV(inc);
  return `<section class="cal-wrap">
    <div class="panel">
      <div class="cal-sum">
        <div><div class="lbl">Entra</div><div class="val money pos">${brl(entTot)}</div></div>
        <div><div class="lbl">Sai</div><div class="val money">${brl(saiTot)}</div></div>
        <div><div class="lbl">Falta pagar</div><div class="val money">${brl(r2(saiTot - pago))}</div></div>
      </div>
      <div class="progress" aria-hidden="true"><span style="width:${saiTot ? ((pago / saiTot) * 100).toFixed(1) : 0}%"></span></div>
      <div class="muted small-note">${saiTot ? `${Math.round((pago / saiTot) * 100)}% das contas do mês já pagas` : ''}</div>
    </div>
    <div class="panel cal-panel">
      <div class="cal-head">${['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'].map((d) => `<span>${d}</span>`).join('')}</div>
      <div class="cal-grid">${cells}</div>
      <div class="legend"><span><i class="dot s-in"></i>Entrada</span><span><i class="dot s-aberto"></i>A vencer</span><span><i class="dot s-logo"></i>Vence em até 3 dias</span><span><i class="dot s-atrasado"></i>Vencido</span><span><i class="dot s-pago"></i>Pago</span><span>★ Melhor dia de compra</span></div>
    </div>
    <div class="panel">
      <div class="panel-h"><h2>${S.selDay ? `Dia ${S.selDay}` : `${MESES[m - 1][0].toUpperCase() + MESES[m - 1].slice(1)}, dia a dia`}</h2>${S.selDay ? '<button class="link" data-act="dayclear">Ver o mês todo</button>' : ''}</div>
      ${list.length ? `<ul class="due due-full">${list.map((e) => e.entrada ? `
        <li class="due-in"><span class="due-d"><b>${e.date.slice(8)}</b>${MES3[+e.date.slice(5, 7) - 1]}</span>
        <span class="due-n">${esc(e.nome)}<small>${esc(INC_CATS[e.cat] || 'Entrada')}</small></span>
        <span class="due-v money pos">+${brl(e.valor)}</span>

        <li class="due-${e.status}"><span class="due-d"><b>${e.date.slice(8)}</b>${MES3[+e.date.slice(5, 7) - 1]}</span>
        <span class="due-n">${esc(e.nome)}<small>${e.kind === 'cartao' ? (e.est ? 'Estimado pelas parcelas já lançadas' : e.fid ? 'Valor da fatura importada' : 'Fatura ainda não importada') : esc(CAT[e.cat]?.nome || 'Conta fixa')}</small></span>

function importBox() {
  return `<div class="panel import ${S.importing ? 'busy' : ''}" id="dropzone">

function fatStatusPill(f) {
  const pi = fatPaidInfo(f);
  if (pi.como === 'zerada') return '<span class="pill ok">Nada a pagar</span>';
  if (pi.pago) return `<span class="pill ok">Paga${pi.data ? ' ' + dBR(pi.data) : ''}</span>`;
  const d = daysBetween(TODAY, f.venc);
  if (d < 0) return `<span class="pill bad">Vencida</span>`;
  if (d <= 3) return `<span class="pill warn">Vence ${d === 0 ? 'hoje' : `em ${d}d`}</span>`;
  return '<span class="pill">A vencer</span>';
}

function payBox(f) {
  const pi = fatPaidInfo(f);
  if (pi.como === 'zerada') return '';
  const d = daysBetween(TODAY, f.venc);
  if (pi.como === 'auto') return `<div class="paybox ok"><span class="pill ok">Paga</span><span>O pagamento de ${dBR(pi.data)} aparece na fatura seguinte deste cartão.</span></div>`;
  if (pi.pago) return `<div class="paybox ok"><span class="pill ok">Paga</span><label class="paydate" for="paydate">em <input type="date" id="paydate" data-act="paydate" data-key="${esc(pi.key)}" value="${esc(pi.data || TODAY)}" max="${TODAY}"></label><button class="link muted" data-act="pay" data-key="${esc(pi.key)}">Desfazer</button></div>`;
  return `<div class="paybox ${d < 0 ? 'bad' : ''}">${d < 0 ? `<span class="pill bad">Vencida há ${-d} dia${-d > 1 ? 's' : ''}</span><span>Se você já pagou, marque aqui.</span>` : `<span class="pill">${d === 0 ? 'Vence hoje' : `Vence em ${d} dia${d > 1 ? 's' : ''}`}</span><span>Quando pagar, marque aqui.</span>`}<button class="btn sm" data-act="pay" data-key="${esc(pi.key)}">Marcar como paga</button></div>`;
}

function viewFaturas() {
  if (S.fatId && D().faturas[S.fatId]) return viewFatura(D().faturas[S.fatId]);
  const fs = allFat();
  return `<section class="stack">${importBox()}
    <div class="panel">
      <div class="panel-h"><h2>Faturas importadas</h2><span class="muted">${fs.length}</span></div>

        <li><button class="fat-row" data-act="openfat" data-id="${esc(f.id)}">
          <span class="bank b-${esc(f.banco)}">${esc(SIGLA[f.banco] || '•')}</span>
          <span class="fat-n">${esc(cardName(c))}<small>vence ${dBR(f.venc)}/${f.venc.slice(0, 4)} · ${f.tx.length} lançamentos</small></span>
          <span class="fat-v"><span class="money">${brl(f.soma)}</span><small>${f.total === 0 ? 'nada a pagar' : `a pagar ${brl(f.total)}`}</small></span>

          ${f.conferido ? '<span class="stamp" title="A soma dos lançamentos bate com o total informado pelo banco">conferido</span>' : f.generico ? '<span class="stamp warn">conferir</span>' : ''}

function viewFatura(f) {
  const c = cardById(f.cardId);
  const tx = f.tx.map((t, i) => ({ ...t, i, ...categorize(t) }));
  const fut = Parser.projectFuture(f);
  const futBy = {};
  for (const p of fut) { const m = addM(f.venc.slice(0, 7), p.k); futBy[m] = r2((futBy[m] || 0) + p.v); }
  const juros = r2(tx.reduce((s, t) => s + (t.juros || 0), 0));
  const enc = f.encargos || 0;
  const needAi = tx.some((t) => t.src !== 'voce' && (t.cat === 'outros' || t.cat === 'servicos' || t.src === 'banco'));
  return `<section class="stack">
    <button class="link back" data-act="closefat"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>Todas as faturas</button>
    <div class="panel fat-head">
      <div class="fh-top">
        <span class="bank b-${esc(f.banco)} lg">${esc(SIGLA[f.banco] || '•')}</span>
        <div><h2>${esc(cardName(c))}</h2><div class="muted">Vencimento ${dBR(f.venc)}/${f.venc.slice(0, 4)}${f.proxFech ? ` · próximo fechamento ${dBR(f.proxFech)}` : ''}</div></div>
      </div>
      ${payBox(f)}

        <div><div class="lbl">Gastos lançados</div><div class="val money">${brl(f.soma)}</div></div>
        <div><div class="lbl">Valor a pagar</div><div class="val money">${brl(f.total)}</div></div>
        ${juros ? `<div><div class="lbl">Juros nos Pix e parcelas</div><div class="val money neg">${brl(juros)}</div></div>` : ''}
        ${enc ? `<div><div class="lbl">Encargos cobrados</div><div class="val money neg">${brl(enc)}</div></div>` : ''}
        ${f.limite ? `<div><div class="lbl">Limite</div><div class="val money">${brl(f.limite)}</div></div>` : ''}
      </div>
      ${f.conferido ? `<div class="check ok"><span class="stamp">conferido</span>A soma dos ${f.tx.length} lançamentos (${brl(f.soma)}) bate com o total informado pelo banco.${enc ? ` Com ${brl(enc)} de encargos, fecha nos ${brl(f.total)} a pagar.` : ''}${f.futuroConferido ? ' As parcelas futuras também batem.' : ''}</div>`
        : f.conferido === false ? `<div class="check bad"><span class="stamp warn">divergência</span>A soma lida (${brl(f.soma)}) não bate com o total do banco (${brl(f.totalLanc)}): ${f.soma < f.totalLanc ? 'faltam' : 'sobram'} ${brl(Math.abs(r2(f.totalLanc - f.soma)))}. Se o app foi atualizado depois que você subiu esta fatura, importe o mesmo PDF de novo e ela é substituída. Se continuar assim, envie o PDF para quem mantém o app, para ajustar a leitura do seu banco.</div>`
        : f.csv ? `<div class="check"><span class="stamp warn">conferir</span>O CSV não traz o total do banco: confira se o valor a pagar (${brl(f.total)}) é o mesmo da fatura no app.</div>`
        : `<div class="check"><span class="stamp warn">conferir</span>Leitura genérica: confira os lançamentos com o PDF. Se algo vier errado, <button class="link" data-act="copylines">copie o texto lido</button> e me mande no chat.</div>`}
      ${enc ? `<div class="note"><strong>Encargos desta fatura:</strong> ${(f.encargosItens || []).map((e) => `${esc(e.nome)} ${brl(e.v)}`).join(' · ')}. Multa e juros de mora aparecem quando a fatura anterior é paga depois do vencimento.</div>` : ''}
      ${f.total === 0 ? (() => { const p = f.pags.find((x) => Math.abs(-x.v - f.soma) < 0.02); return `<div class="note">Esta fatura veio zerada porque ${p ? `o pagamento de ${brl(-p.v)} em ${dBR(p.d)} já cobriu os lançamentos` : 'pagamentos feitos antes do fechamento já cobriram os lançamentos'}. Os gastos continuam contando no mês.</div>`; })() : ''}
    </div>

    <div class="panel">
      <div class="panel-h"><h2>Lançamentos</h2>
        <span class="ph-acts">${S.ai.fn && needAi ? `<button class="btn sm" data-act="ai" ${S.ai.busy ? 'disabled' : ''}>${S.ai.busy ? 'Pensando…' : 'Sugerir categorias com IA'}</button>` : ''}</span></div>
      <p class="hint-p">Trocar a categoria cria uma regra para aquele estabelecimento, que vale também nas próximas faturas.</p>
      <div class="tbl-wrap"><table class="tx">
        <thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th class="num">Valor</th></tr></thead>
        <tbody>${tx.map((t) => `<tr>
          <td class="mono">${dBR(t.d)}</td>
          <td><span class="t-desc">${esc(t.desc)}${t.parc ? ` <span class="tag">${t.parc[0]}/${t.parc[1]}</span>` : ''}</span>${t.hint ? `<small>${esc(t.hint)}</small>` : ''}</td>
          <td><span class="sel-wrap"><i class="sw" style="background:${CAT[t.cat].cor}"></i><select id="cat-${esc(f.id)}-${t.i}" data-act="setcat" data-i="${t.i}" aria-label="Categoria de ${esc(t.desc)}">${CATS.map(([id, n]) => `<option value="${id}" ${id === t.cat ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select></span>
            <small class="src">${{ voce: 'sua regra', ia: 'sugestão da IA', banco: 'pelo ramo informado pelo banco', auto: 'automático' }[t.src]}</small></td>
          <td class="num money">${brl(t.v)}</td></tr>`).join('')}</tbody>

      ${f.pags.length ? `<button class="link" data-act="togglepags">${S.showPags ? 'Esconder' : 'Mostrar'} pagamentos (${f.pags.length})</button>

    </div>

    ${fut.length ? `<div class="panel">
      <div class="panel-h"><h2>Parcelas que ainda virão</h2><span class="muted">${brl(r2(fut.reduce((s, p) => s + p.v, 0)))} no total</span></div>
      <div class="fut">${Object.entries(futBy).map(([m, v]) => `<div class="fut-m"><span>${mesCurto(m)}</span><b class="money">${brl(v)}</b></div>`).join('')}</div>
    </div>` : ''}

    <div class="danger-zone">${S.confirm === 'delfat' ? `<span>Apagar esta fatura? Os gastos dela somem do resumo.</span><button class="btn bad" data-act="delfat">Apagar</button><button class="btn ghost" data-act="cancel">Manter</button>` : `<button class="link muted" data-act="askdelfat">Apagar esta fatura</button>`}</div>
  </section>`;
}

const b64 = (buf) => { const a = new Uint8Array(buf); let s = ''; for (let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000)); return btoa(s); };

function parseMoney(s) {
  if (typeof s === 'number') return s;
  s = String(s || '').replace(/[^\d,.-]/g, '');
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  const v = parseFloat(s);
  return isNaN(v) ? null : r2(v);
}

  if (form && form.startsWith('acc-')) { accSubmit(form); return; }
  if (form && form.startsWith('lock-')) { lockSubmit(form); return; }
  if (form === 'pwd') { const p = $('#pdfpwd').value; runImport(p); return; }
  const d = S.edit?.draft;
  if (!d) return;
  leaveExample();
  const cfg = S.data.cfg;
  if (form === 'meta' || form === 'gasto' || form === 'conta' || form === 'orc' || form === 'objetivo' || form === 'aporte') {
    const okx = submitExtra(form, d);
    if (!okx) return;
    S.edit = null; S.confirm = null; Store.saveCfg(); render();
    return;
  }
  if (form === 'card') {
    const venc = parseInt(d.venc, 10);
    if (!(venc >= 1 && venc <= 31)) { toast('Informe o dia do vencimento (1 a 31).'); return; }
    const fech = parseInt(d.fech, 10);
    const c = { id: d.id || 'c' + uid(), banco: d.banco, nome: (d.nome || '').trim(), final: String(d.final || '').replace(/\D/g, '').slice(-4), fech: fech >= 1 && fech <= 31 ? fech : null, venc, limite: parseMoney(d.limite) };
    const i = cfg.cards.findIndex((x) => x.id === c.id);
    if (i >= 0) cfg.cards[i] = c; else cfg.cards.push(c);
    toast('Cartão salvo.');
  } else if (form === 'income' || form === 'avulsa') {
    const valor = parseMoney(d.valor);
    if (!d.nome?.trim()) { toast('Dê um nome para a entrada.'); return; }
    if (valor == null || valor <= 0) { toast('Informe o valor que entra.'); return; }
    if (form === 'income') {
      const dia = parseInt(d.dia, 10);
      if (!(dia >= 1 && dia <= 31)) { toast('Informe o dia em que o dinheiro cai (1 a 31).'); return; }
      if (d.inicio && d.fim && d.fim < d.inicio) { toast('O mês final vem antes do inicial.'); return; }
      const x = { id: d.id || 'i' + uid(), nome: d.nome.trim(), valor, dia, cat: d.cat || 'salario', inicio: d.inicio || '', fim: d.fim || '' };
      cfg.incomes = cfg.incomes || [];

    } else {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(d.data || '')) { toast('Informe a data da entrada.'); return; }
      const x = { id: d.id || 'a' + uid(), nome: d.nome.trim(), valor, data: d.data, cat: d.cat || 'extra' };
      cfg.entradas = cfg.entradas || [];
      const i = cfg.entradas.findIndex((y) => y.id === x.id);
      if (i >= 0) cfg.entradas[i] = x; else cfg.entradas.push(x);
    }
    toast('Entrada salva.');
  } else if (form === 'bill') {
    const valor = parseMoney(d.valor), dia = parseInt(d.dia, 10);
    if (!d.nome?.trim()) { toast('Dê um nome para a conta.'); return; }
    if (valor == null) { toast('Informe o valor da conta.'); return; }
    if (!(dia >= 1 && dia <= 31)) { toast('Informe o dia do vencimento (1 a 31).'); return; }
    if (d.inicio && d.fim && d.fim < d.inicio) { toast('O mês final vem antes do inicial.'); return; }
    const x = { id: d.id || 'b' + uid(), nome: d.nome.trim(), valor, dia, cat: d.cat || 'outros', cartao: d.cartao || '', inicio: d.inicio || '', fim: d.fim || '' };
    const i = cfg.bills.findIndex((y) => y.id === x.id);
    if (i >= 0) cfg.bills[i] = x; else cfg.bills.push(x);
    toast('Conta salva.');
  }
  S.edit = null; S.confirm = null;
  Store.saveCfg();
  render();

async function importJson(file) {
  if (!file) return;
  try {
    const o = JSON.parse(await file.text());
    if (!o || !o.cfg || !o.faturas) throw new Error('fmt');
    leaveExample();
    S.data = { cfg: { ...EMPTY().cfg, ...o.cfg, lock: S.data.cfg.lock, perfil: S.data.cfg.perfil || o.cfg.perfil }, faturas: o.faturas };
    migrate(S.data);
    if (S.mode === 'conta') { Store.write('cfg', clone(S.data.cfg)); for (const f of Object.values(S.data.faturas)) Store.saveFatura(f); } else Store.saveLocal();
    toast('Backup restaurado.');
    render();
  } catch (e) { toast('Esse arquivo não é um backup do Economize.'); }
}

/* ===== Economize v3: meta de gasto, saldo, avisos, calendário (.ics), relatório, migração ===== */
const SCHEMA = 3;

/* ---------- versão dos dados e migração ---------- */
function migrate(data) {
  const c = data.cfg;
  let ch = false;
  for (const k of ['cards', 'bills', 'incomes', 'entradas', 'gastos']) if (!Array.isArray(c[k])) { c[k] = []; ch = true; }
  for (const k of ['rules', 'paid', 'recebido', 'metas']) if (!c[k] || typeof c[k] !== 'object') { c[k] = {}; ch = true; }
  if (!c.conta || typeof c.conta !== 'object') { c.conta = { saldo: null, em: null, cheque: null }; ch = true; }
  if (!c.criadoEm) { c.criadoEm = TODAY; ch = true; }
  if (c.v !== SCHEMA) { c.v = SCHEMA; ch = true; }
  return ch;
}
const bkKey = (u) => 'economize.bk.' + u;
const hasBk = () => { try { return S.mode === 'contas' && S.session && !!localStorage.getItem(bkKey(S.session.u)); } catch (e) { return false; } };

/* ---------- baixar arquivo ---------- */
async function saveFile(filename, mime, text, okMsg) {
  if (!S.dl) {
    const url = URL.createObjectURL(new Blob([text], { type: mime }));
    const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    if (okMsg) toast(okMsg);
    return;
  }
  try { await S.dl.save({ filename, data: text }); } catch (e) { if (e && e.code !== 'declined') toast('Não consegui gerar o arquivo agora.'); }
}

/* ---------- meta de gastos ---------- */
const gastos = () => D().cfg.gastos || (D().cfg.gastos = []);
const gastosOf = (M) => gastos().filter((g) => (g.data || '').slice(0, 7) === M);
function metaOf(M) {
  const m = D().cfg.metas || {};
  const k = Object.keys(m).filter((x) => x <= M && +m[x] > 0).sort().pop();
  return k ? +m[k] : null;
}
const contaCfg = () => D().cfg.conta || (D().cfg.conta = { saldo: null, em: null, cheque: null });

function viewMeta() {
  const M = S.month, E = S.edit;
  const lim = metaOf(M);
  const gs = gastosOf(M).sort((a, b) => (a.data < b.data ? 1 : a.data > b.data ? -1 : 0));
  const tot = sumV(gs, (g) => +g.valor);
  const rest = lim != null ? r2(lim - tot) : null;
  const pct = lim > 0 ? Math.round((tot / lim) * 100) : null;
  const cls = pct == null ? '' : pct > 100 ? 'bad' : pct >= 85 ? 'warn' : 'ok';
  let porDia = '';
  if (lim != null && M === CUR && rest > 0) {
    const [y, m] = M.split('-').map(Number);
    const left = new Date(y, m, 0).getDate() - +TODAY.slice(8) + 1;
    porDia = `Dá para gastar cerca de <b>${brl(r2(rest / left))}</b> por dia nos ${left} dia${left > 1 ? 's' : ''} que faltam, contando hoje.`;
  }
  const byCat = {};
  for (const g of gs) { const c = g.cat || categorize({ desc: g.nome }).cat; byCat[c] = r2((byCat[c] || 0) + (+g.valor || 0)); }
  const cats = Object.entries(byCat).sort((a, b) => b[1] - a[1]);

  const metaForm = (d) => `<form class="form" data-form="meta">
    ${field('e-valor', `Meu limite de gastos em ${MESES[+M.slice(5) - 1]} (R$)`, d.valor, 'inputmode="decimal" placeholder="Ex.: 3000,00"')}
    <p class="hint-p">O limite vale para este mês e para os próximos, até você mudar. Deixe em branco para tirar.</p>
    <div class="form-acts"><button class="btn" type="submit">Salvar limite</button><button class="btn ghost" type="button" data-act="cancel">Cancelar</button></div></form>`;
  const gastoForm = (d) => `<form class="form" data-form="gasto">
    ${field('e-nome', 'O que foi', d.nome, 'placeholder="Ex.: Picolé, Uber, mercado" required')}
    ${field('e-valor', 'Valor (R$)', d.valor, 'inputmode="decimal" placeholder="0,00" required')}
    ${field('e-data', 'Data', d.data, 'type="date" required')}
    <label class="fld" for="e-cat"><span>Categoria</span><select id="e-cat" data-f="cat"><option value="">Automática</option>${CATS.map(([id, n]) => `<option value="${id}" ${d.cat === id ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
    <div class="form-acts"><button class="btn" type="submit">Salvar gasto</button><button class="btn ghost" type="button" data-act="cancel">Cancelar</button>
    ${d.id ? (S.confirm === 'delgasto' ? `<span class="confirm">Apagar este gasto? <button class="btn bad sm" type="button" data-act="delgasto">Apagar</button></span>` : `<button class="link muted" type="button" data-act="askdelgasto">Apagar</button>`) : ''}</div></form>`;
  const contaForm = (d) => `<form class="form" data-form="conta">
    ${field('e-saldo', 'Saldo hoje na conta corrente (R$)', d.saldo, 'inputmode="decimal" placeholder="Use sinal de menos se estiver negativo" required')}
    ${field('e-cheque', 'Limite do cheque especial (R$)', d.cheque, 'inputmode="decimal" placeholder="0,00 se não tiver"')}
    <p class="hint-p">Você atualiza o saldo quando quiser. Depois eu posso ler o extrato do banco para isso ser automático.</p>
    <div class="form-acts"><button class="btn" type="submit">Salvar saldo</button><button class="btn ghost" type="button" data-act="cancel">Cancelar</button></div></form>`;

  // conta corrente
  const ct = contaCfg();
  const temSaldo = ct.saldo != null && ct.em;
  let ctHtml;
  if (!temSaldo) ctHtml = '<div class="empty">Informe quanto você tem hoje na conta corrente. É rápido e ajuda a ver se o mês fecha.</div>';
  else {
    const cheque = +ct.cheque || 0;
    const usando = ct.saldo < 0 ? r2(-ct.saldo) : 0;
    const disp = r2(ct.saldo + cheque);
    const dias = daysBetween(ct.em, TODAY);
    ctHtml = `<div class="conta-fig"><div><span class="lbl">Saldo na conta</span><span class="bal-v money ${ct.saldo < 0 ? 'neg' : ''}">${brl(ct.saldo)}</span><small class="muted">informado ${dias <= 0 ? 'hoje' : dias === 1 ? 'ontem' : `há ${dias} dias`}</small></div>
      ${cheque ? `<div><span class="lbl">Cheque especial</span><span class="bal-v money">${brl(cheque)}</span><small class="muted">${usando ? `usando ${brl(usando)} (${Math.min(100, Math.round((usando / cheque) * 100))}%)` : 'sem usar'}</small></div><div><span class="lbl">Disponível</span><span class="bal-v money">${brl(disp)}</span><small class="muted">saldo + cheque</small></div>` : ''}</div>
      ${usando ? `<div class="note warn-note">Você está no vermelho em ${brl(usando)}. O cheque especial cobra juros altos todo dia${cheque && usando > cheque ? ', e já passou do limite' : ''}.</div>` : ''}
      ${dias >= 3 ? `<div class="note">O saldo foi informado há ${dias} dias. Atualize para ele refletir a realidade.</div>` : ''}`;
  }

  return `<section class="stack">
    <div class="panel inc-hero meta-hero ${cls}">
      <div>
        <div class="eyebrow">Meta de gastos de ${esc(MESES[+M.slice(5) - 1])}</div>
        ${lim != null ? `<div class="big money ${rest < 0 ? 'neg' : 'pos-ink'}">${rest >= 0 ? brl(rest) : brl(-rest)}</div>
        <div class="muted">${rest >= 0 ? 'ainda disponível do limite de ' + brl(lim) : 'acima do limite de ' + brl(lim)}</div>`
        : `<div class="big money pos-ink">${brl(tot)}</div><div class="muted">gasto neste mês. Defina um limite para acompanhar quanto ainda pode gastar.</div>`}
      </div>
      <div class="inc-sum"><div><span class="lbl">Gasto</span><span class="money">${brl(tot)}</span></div>
      <div><span class="lbl">Limite</span><span class="money">${lim != null ? brl(lim) : '—'}</span></div></div>
    </div>
    ${pct != null ? `<div class="panel"><div class="gauge ${cls}" role="img" aria-label="Você usou ${pct}% do limite">
      <div class="gauge-track"><span style="width:${Math.min(100, pct)}%"></span>${pct > 100 ? '<i class="over"></i>' : ''}</div>
      <div class="gauge-txt"><b>${pct}%</b> do limite usado · <span class="g-st">${pct > 100 ? 'limite estourado' : pct >= 85 ? 'perto do limite' : 'dentro da meta'}</span></div>
      ${porDia ? `<div class="gauge-txt">${porDia}</div>` : ''}</div></div>` : ''}
    <div class="panel">
      <div class="panel-h"><h2>Limite do mês</h2>${E?.kind === 'meta' ? '' : `<button class="btn sm" data-act="editmeta">${lim != null ? 'Mudar limite' : 'Definir limite'}</button>`}</div>
      ${E?.kind === 'meta' ? metaForm(E.draft) : `<p class="hint-p" style="margin:0">${lim != null ? `Seu limite é de <b>${brl(lim)}</b> por mês. Os gastos que você lança aqui abatem desse valor, sem depender das faturas.` : 'Escolha quanto você quer gastar por mês. Cada gasto lançado aqui abate do limite, e você vê na hora se ainda cabe.'}</p>`}
    </div>
    <div class="panel">
      <div class="panel-h"><h2>Gastos de ${esc(MESES[+M.slice(5) - 1])}</h2>${E?.kind === 'gasto' && !E.draft.id ? '' : '<button class="btn sm" data-act="newgasto">Adicionar gasto</button>'}</div>
      ${E?.kind === 'gasto' && !E.draft.id ? gastoForm(E.draft) : ''}
      ${cats.length > 1 ? `<div class="chips-row">${cats.slice(0, 4).map(([c, v]) => `<span class="chip"><i class="sw" style="background:${CAT[c]?.cor}"></i>${esc(CAT[c]?.nome)} ${brl(v)}</span>`).join('')}</div>` : ''}
      ${gs.length ? `<ul class="inc-list gasto-list">${gs.map((g) => {
        if (E?.kind === 'gasto' && E.draft.id === g.id) return `<li class="editing">${gastoForm(E.draft)}</li>`;
        const c = g.cat || categorize({ desc: g.nome }).cat;
        return `<li class="inc"><button class="inc-main" data-act="editgasto" data-id="${esc(g.id)}">
          <span class="due-d"><b>${g.data.slice(8)}</b>${MES3[+g.data.slice(5, 7) - 1]}</span>
          <span class="item-n">${esc(g.nome)}<small><i class="sw" style="background:${CAT[c]?.cor}"></i>${esc(CAT[c]?.nome || '')}</small></span>
          <span class="inc-v money">${brl(+g.valor)}</span></button></li>`;
      }).join('')}</ul>` : (E?.kind === 'gasto' ? '' : '<div class="empty">Nenhum gasto lançado neste mês. Comprou um picolé? Toque em Adicionar gasto.</div>')}
    </div>
    ${orcPanel(M, E)}
    ${objPanel(E)}
    <div class="panel">
      <div class="panel-h"><h2>Conta corrente</h2>${E?.kind === 'conta' ? '' : `<button class="btn sm" data-act="editconta">${temSaldo ? 'Atualizar saldo' : 'Informar saldo'}</button>`}</div>
      ${E?.kind === 'conta' ? contaForm(E.draft) : ctHtml}
    </div>
  </section>`;
}

function submitExtra(form, d) {
  const cfg = S.data.cfg;
  if (form === 'meta') {
    const v = parseMoney(d.valor);
    cfg.metas = cfg.metas || {};
    if (v && v > 0) cfg.metas[S.month] = v; else delete cfg.metas[S.month];
    toast(v && v > 0 ? 'Limite salvo.' : 'Limite removido.');
    return true;
  }
  if (form === 'gasto') {
    const valor = parseMoney(d.valor);
    if (!d.nome?.trim()) { toast('Diga o que foi o gasto.'); return false; }
    if (valor == null || valor <= 0) { toast('Informe o valor do gasto.'); return false; }
    if (!/^\d{4}-\d{2}-\d{2}$/.test(d.data || '')) { toast('Informe a data.'); return false; }
    const x = { id: d.id || 'g' + uid(), nome: d.nome.trim(), valor, data: d.data, cat: d.cat || '' };
    cfg.gastos = cfg.gastos || [];
    const i = cfg.gastos.findIndex((y) => y.id === x.id);
    if (i >= 0) cfg.gastos[i] = x; else cfg.gastos.push(x);
    toast('Gasto salvo.');
    return true;
  }
  if (form === 'conta') {
    const saldo = parseMoney(d.saldo);
    if (saldo == null) { toast('Informe o saldo da conta.'); return false; }
    cfg.conta = { saldo, em: TODAY, cheque: parseMoney(d.cheque) || null };
    toast('Saldo atualizado.');
    return true;
  }
  if (form === 'orc') {
    if (!d.cat || !CAT[d.cat]) { toast('Escolha a categoria.'); return false; }
    const v = parseMoney(d.valor);
    cfg.orc = cfg.orc || {};
    if (v && v > 0) cfg.orc[d.cat] = v; else delete cfg.orc[d.cat];
    toast(v && v > 0 ? 'Orçamento salvo.' : 'Orçamento removido.');
    return true;
  }
  if (form === 'objetivo') {
    const alvo = parseMoney(d.alvo), guardado = parseMoney(d.guardado) || 0;
    if (!d.nome?.trim()) { toast('Dê um nome para o objetivo.'); return false; }
    if (alvo == null || alvo <= 0) { toast('Informe quanto você quer juntar.'); return false; }
    if (guardado < 0) { toast('O valor guardado não pode ser negativo.'); return false; }
    if (d.prazo && !/^\d{4}-\d{2}$/.test(d.prazo)) { toast('Informe o mês do prazo.'); return false; }
    const x = { id: d.id || 'o' + uid(), nome: d.nome.trim(), alvo, guardado, prazo: d.prazo || '', criado: d.criado || TODAY };
    cfg.objetivos = cfg.objetivos || [];
    const k = cfg.objetivos.findIndex((y) => y.id === x.id);
    if (k >= 0) cfg.objetivos[k] = x; else cfg.objetivos.push(x);
    toast('Objetivo salvo.');
    return true;
  }
  if (form === 'aporte') {
    const v = parseMoney(d.valor);
    const o = (cfg.objetivos || []).find((y) => y.id === d.id);
    if (!o) return false;
    if (v == null || v === 0) { toast('Informe o valor. Use sinal de menos se retirou.'); return false; }
    o.guardado = Math.max(0, r2((+o.guardado || 0) + v));
    toast(o.guardado >= o.alvo ? 'Objetivo alcançado. Parabéns!' : v > 0 ? 'Guardado. Continue assim.' : 'Retirada registrada.');
    return true;
  }
  return null;
}

/* ---------- primeiros passos (guia depois do login) ---------- */
function passosList() {
  const c = S.data.cfg;
  return [
    { id: 'fat', done: Object.keys(S.data.faturas).length > 0, t: 'Importe sua primeira fatura', d: 'PDF ou CSV do banco. O cartão é criado sozinho, com fechamento e vencimento.', btn: '<button class="btn sm" data-act="goimport">Importar fatura</button>' },
    { id: 'ent', done: (c.incomes || []).length > 0 || (c.entradas || []).length > 0, t: 'Cadastre o que entra por mês', d: 'Salário e outras entradas. Com elas o app mostra quanto sobra.', btn: '<button class="btn sm" data-nav-to="entradas">Cadastrar entrada</button>' },
    { id: 'fix', done: (c.bills || []).length > 0, t: 'Cadastre as contas fixas', d: 'Aluguel, luz, água, internet, empréstimo. Dá para marcar começo, fim e se é paga no cartão.', btn: '<button class="btn sm" data-nav-to="cadastro">Cadastrar conta</button>' },
    { id: 'cal', done: !!(c.passos && c.passos.cal), t: 'Veja o calendário e marque o que pagou', d: 'Os vencimentos do mês ficam lá. Toque em "Paguei" quando quitar.', btn: '<button class="btn sm" data-nav-to="calendario">Abrir calendário</button>' },
    { id: 'meta', done: Object.keys(c.metas || {}).length > 0, t: 'Defina a meta de gastos do mês', d: 'Na aba Meta você acompanha o que já gastou contra o limite que escolheu.', btn: '<button class="btn sm" data-nav-to="meta">Definir meta</button>' },
    { id: 'bk', done: !!c.ultimoBackup, t: 'Baixe um backup', d: 'Seus dados ficam só neste aparelho. O backup é a sua garantia. Fica em Cadastro.', btn: '<button class="btn sm" data-nav-to="cadastro">Ir para Cadastro</button>' },
  ];
}
function passosCard(vazio) {
  const c = S.data.cfg, ps = passosList(), n = ps.filter((p) => p.done).length;
  if (n === ps.length || (!vazio && c.passosOff)) return '';
  const next = ps.find((p) => !p.done);
  return `<section class="panel onboard passos">

/* ---------- lembretes no calendário do celular ---------- */
function buildIcs() {
  const evs = [CUR, addM(CUR, 1), addM(CUR, 2)].flatMap(eventsOf).filter((e) => !e.pago && e.date >= TODAY);
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
  const ds = (iso) => iso.replace(/-/g, '');
  const nextDay = (iso) => { const d = new Date(iso + 'T12:00'); d.setDate(d.getDate() + 1); return `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}`; };
  const esc2 = (s) => String(s).replace(/\\/g, '\\\\').replace(/([,;])/g, '\\$1').replace(/\n/g, '\\n');
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Economize//PT-BR//', 'CALSCALE:GREGORIAN', 'X-WR-CALNAME:Vencimentos Economize'];
  for (const e of evs) {
    const nome = `Vence: ${e.nome}${e.valor ? ' · ' + brl(e.valor).replace(/ /g, ' ') + (e.est ? ' (estimado)' : '') : ''}`;
    L.push('BEGIN:VEVENT', `UID:${e.key.replace(/[^\w:-]/g, '')}@economize`, `DTSTAMP:${stamp}`, `DTSTART;VALUE=DATE:${ds(e.date)}`, `DTEND;VALUE=DATE:${nextDay(e.date)}`,
      `SUMMARY:${esc2(nome)}`, 'TRANSP:TRANSPARENT',
      'BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${esc2(nome)} amanhã`, 'TRIGGER:-PT15H', 'END:VALARM',
      'BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${esc2(nome)} hoje`, 'TRIGGER:PT8H', 'END:VALARM', 'END:VEVENT');
  }
  L.push('END:VCALENDAR');
  return { text: L.join('\r\n') + '\r\n', n: evs.length };
}
function exportIcs() {
  const { text, n } = buildIcs();
  if (!n) { toast('Não há vencimentos em aberto nos próximos meses.'); return; }
  saveFile('economize-vencimentos.ics', 'text/calendar', text, `Arquivo com ${n} vencimento${n > 1 ? 's' : ''} baixado. Abra-o e escolha adicionar ao calendário.`);
}

/* ===== v16: cartão principal do mês, nota do mês e dicas de economia ===== */
function notaMes({ entradas, saidas, sp, ev, parcMes }) {
  if (!(entradas > 0)) return null;
  const f = [];
  const pct = (saidas / entradas) * 100;
  if (pct > 100) f.push([-40, `As saídas passam da renda (${Math.round(pct)}%)`]);
  else if (pct >= 85) f.push([-20, `As saídas levam ${Math.round(pct)}% da renda`]);
  else if (pct >= 70) f.push([-8, `As saídas levam ${Math.round(pct)}% da renda`]);
  const pj = (sp.juros / entradas) * 100;
  if (pj > 3) f.push([-20, `Juros e tarifas levam ${pj.toFixed(1).replace('.', ',')}% da renda`]);
  else if (pj > 1) f.push([-12, `Juros e tarifas levam ${pj.toFixed(1).replace('.', ',')}% da renda`]);
  else if (sp.juros > 0) f.push([-6, `${brl(sp.juros)} em juros e tarifas`]);
  const pp = (parcMes / entradas) * 100;
  if (pp > 40) f.push([-15, `Parcelas tomam ${Math.round(pp)}% da renda`]);
  else if (pp > 25) f.push([-8, `Parcelas tomam ${Math.round(pp)}% da renda`]);
  const atr = ev.filter((x) => !x.pago && x.status === 'atrasado').length;
  if (atr) f.push([-Math.min(15, atr * 5), `${atr} conta${atr > 1 ? 's' : ''} em atraso`]);
  if (sp.tx.some((t) => t.cat === 'pix' && t.juros)) f.push([-5, 'Pix no crédito com juros']);
  const n = Math.max(0, 100 + f.reduce((s, x) => s + x[0], 0));
  return { n, f, cls: n >= 80 ? 'ok' : n >= 60 ? 'warn' : 'bad', txt: n >= 80 ? 'Mês no azul' : n >= 60 ? 'Pede atenção' : 'Sinal de alerta' };
}

function dicasEconomia({ M, entradas, saidas, sp, prevSp, pcs }) {
  const d = [];
  let pot = 0;
  if (sp.juros > 0) { d.push({ ic: 'juros', t: `${brl(sp.juros)} foram para juros e tarifas`, s: 'Pagar as faturas até o vencimento e fugir do Pix no crédito zera essa conta.', ano: r2(sp.juros * 12) }); pot += sp.juros * 12; }
  const ass = sp.tx.filter((t) => t.cat === 'assinaturas' && !t.encargo).concat(sp.bl.filter((t) => t.cat === 'assinaturas'));
  if (ass.length) { const tot = sumV(ass, (t) => t.v); const mx = ass.slice().sort((a, b) => b.v - a.v)[0]; d.push({ ic: 'parc', t: `${ass.length} assinatura${ass.length > 1 ? 's' : ''} somam ${brl(tot)} por mês`, s: `Dá ${brl(r2(tot * 12))} por ano. A maior é ${mx.desc} (${brl(mx.v)}). Ainda usa todas?` }); }
  const an = sp.tx.filter((t) => /anuidade|mensalidade - plano/i.test(t.desc));
  if (an.length) { const tot = sumV(an, (t) => t.v); d.push({ ic: 'card', t: `${brl(tot)} de anuidade de cartão`, s: 'Ligue e peça isenção. Muitos bancos tiram para não perder o cliente.', ano: r2(tot * 12) }); pot += tot * 12; }
  const com = sp.tx.filter((t) => t.cat === 'alimentacao');
  const comTot = sumV(com, (t) => t.v);
  if (com.length >= 4 && comTot > 150) { const corte = r2(comTot * 0.2); d.push({ ic: 'pix', t: `Comer fora e delivery: ${brl(comTot)} em ${com.length} compras`, s: `Cortar 1 em cada 5 pedidos economiza cerca de ${brl(corte)} por mês.`, ano: r2(corte * 12) }); pot += corte * 12; }
  let cres = null;
  for (const [c, v] of Object.entries(sp.byCat)) { const a = prevSp.byCat[c] || 0; if (a > 0 && v - a > 100 && c !== 'tarifas' && (!cres || v - a > cres.dif)) cres = { c, dif: r2(v - a), a }; }
  if (cres) d.push({ ic: 'juros', t: `${CAT[cres.c].nome} subiu ${brl(cres.dif)}`, s: `Era ${brl(cres.a)} em ${MES3[+addM(M, -1).slice(5) - 1]}. Vale olhar o que mudou.` });
  const fimProx = pcs.filter((p) => p.fim >= M && p.fim <= addM(M, 2)).sort((a, b) => b.mensal - a.mensal);
  if (fimProx.length) { const tot = sumV(fimProx, (p) => p.mensal); d.push({ ic: 'parc', bom: true, t: `${brl(tot)} por mês ficam livres até ${mesCurto(addM(M, 2))}`, s: `${fimProx.length} parcelamento${fimProx.length > 1 ? 's terminam' : ' termina'} em breve. Se não parcelar de novo, esse valor vira folga.` }); }
  return { d, pot: r2(pot) };
}

function dicasCard(o) {
  const { d, pot } = dicasEconomia(o);
  if (!d.length) return '';
  const show = S.showDicas ? d : d.slice(0, 3);

    <p class="hint-p">Vale para todos os meses, até você mudar. Deixe em branco para tirar.</p>
    <div class="form-acts"><button class="btn" type="submit">Salvar orçamento</button><button class="btn ghost" type="button" data-act="cancel">Cancelar</button></div></form>`;
  const totO = sumV(ids, (c) => orc[c]), totG = sumV(ids, (c) => by[c] || 0);
  return `<div class="panel">
    <div class="panel-h"><h2>Orçamento por categoria</h2>${E?.kind === 'orc' ? '' : '<button class="btn sm" data-act="neworc">Definir</button>'}</div>
    ${E?.kind === 'orc' ? form(E.draft) : ''}
    ${ids.length ? `<ul class="orc-l">${ids.map((c) => {
      const g = by[c] || 0, p = Math.round((g / orc[c]) * 100), cls = p > 100 ? 'bad' : p >= 85 ? 'warn' : 'ok';
      return `<li><button class="orc-row ${cls}" data-act="editorc" data-cat="${c}" aria-label="${esc(CAT[c].nome)}: ${brl(g)} de ${brl(orc[c])}. Toque para mudar.">
        <span class="orc-top"><span class="orc-n"><i class="sw" style="background:${CAT[c].cor}"></i>${esc(CAT[c].nome)}</span><span class="orc-v"><b class="money">${brl(g)}</b> de ${brl(orc[c])}</span></span>
        <span class="orc-bar"><span style="width:${Math.min(100, p)}%"></span></span>
        <span class="orc-s">${p > 100 ? `passou ${brl(r2(g - orc[c]))}` : `sobram ${brl(r2(orc[c] - g))}`} · ${p}%</span></button></li>`; }).join('')}</ul>
      <p class="hint-p" style="margin:8px 0 0">Total: <b>${brl(totG)}</b> de ${brl(totO)} em ${esc(MESES[+M.slice(5) - 1])}. Soma as faturas do mês, as contas fixas e os gastos lançados aqui.</p>`
      : (E?.kind === 'orc' ? '' : '<div class="empty">Defina quanto quer gastar em cada categoria, como R$ 600 no mercado, e acompanhe pela barrinha.</div>')}
  </div>`;
}
function objPanel(E) {
  const os = objetivos();
  const form = (d) => `<form class="form" data-form="objetivo">
    ${field('e-nome', 'Para que é', d.nome, 'placeholder="Ex.: Viagem, reserva de emergência" required')}
    ${field('e-alvo', 'Quanto quero juntar (R$)', d.alvo, 'inputmode="decimal" placeholder="Ex.: 5000,00" required')}
    ${field('e-guardado', 'Quanto já tenho guardado (R$)', d.guardado, 'inputmode="decimal" placeholder="0,00"')}
    ${field('e-prazo', 'Até quando (opcional)', d.prazo, 'type="month"')}
    <div class="form-acts"><button class="btn" type="submit">Salvar objetivo</button><button class="btn ghost" type="button" data-act="cancel">Cancelar</button>
    ${d.id ? (S.confirm === 'delobj' ? `<span class="confirm">Apagar este objetivo? <button class="btn bad sm" type="button" data-act="delobj">Apagar</button></span>` : `<button class="link muted" type="button" data-act="askdelobj">Apagar</button>`) : ''}</div></form>`;
  const aporte = (d) => `<form class="form" data-form="aporte">
    ${field('e-valor', 'Quanto guardei agora (R$)', d.valor, 'inputmode="decimal" placeholder="Ex.: 200,00. Use menos se retirou" required')}
    <div class="form-acts"><button class="btn" type="submit">Somar ao objetivo</button><button class="btn ghost" type="button" data-act="cancel">Cancelar</button></div></form>`;
  return `<div class="panel">
    <div class="panel-h"><h2>Objetivos</h2>${E?.kind === 'objetivo' && !E.draft.id ? '' : '<button class="btn sm" data-act="newobj">Novo objetivo</button>'}</div>
    ${E?.kind === 'objetivo' && !E.draft.id ? form(E.draft) : ''}
    ${os.length ? `<ul class="obj-l">${os.map((o) => {
      if (E?.kind === 'objetivo' && E.draft.id === o.id) return `<li class="editing">${form(E.draft)}</li>`;
      const g = +o.guardado || 0, p = Math.min(100, Math.round((g / o.alvo) * 100)), falta = r2(Math.max(0, o.alvo - g));
      let dica = '';
      if (falta <= 0) dica = 'Objetivo alcançado.';
      else if (o.prazo) {
        const [y1, m1] = CUR.split('-').map(Number), [y2, m2] = o.prazo.split('-').map(Number);
        const meses = (y2 - y1) * 12 + (m2 - m1) + 1;
        dica = meses >= 1 ? `Faltam ${brl(falta)}. Guardando ${brl(r2(falta / meses))} por mês você chega lá em ${mesCurto(o.prazo)}.` : `Faltam ${brl(falta)}. O prazo de ${mesCurto(o.prazo)} já passou.`;
      } else dica = `Faltam ${brl(falta)}.`;
      return `<li class="obj ${falta <= 0 ? 'done' : ''}">
        <div class="obj-top"><button class="obj-n" data-act="editobj" data-id="${esc(o.id)}" aria-label="Editar objetivo ${esc(o.nome)}">${esc(o.nome)}<small>${o.prazo ? 'até ' + esc(mesCurto(o.prazo)) : 'sem prazo'}</small></button><span class="obj-p">${p}%</span></div>
        <div class="obj-bar"><span style="width:${p}%"></span></div>
        <div class="obj-v"><b class="money">${brl(g)}</b> de ${brl(o.alvo)}</div>
        <div class="obj-s">${dica}</div>
        ${E?.kind === 'aporte' && E.draft.id === o.id ? aporte(E.draft) : `<button class="btn sm ghost" data-act="aporte" data-id="${esc(o.id)}">Guardei mais</button>`}
      </li>`; }).join('')}</ul>`
      : (E?.kind === 'objetivo' ? '' : '<div class="empty">Crie um objetivo, como juntar R$ 5.000 para uma viagem, e acompanhe quanto já guardou.</div>')}
  </div>`;
}


/* ---------- início ---------- */
(function boot() {
  const h = location.hash.slice(1);
  if (VIEWS[h]) S.view = h;
  render();
  Store.init();
  (async () => {
    try {
      if (!window.claude || !claude.use) return;
      const [sample, dl] = await Promise.all([claude.use('sample'), claude.use('downloads')]);
      S.ai.fn = sample || null;
      S.dl = dl || null;
      if (S.loaded) render();
    } catch (e) {}
  })();
})();

</script>

</body>
</html>
