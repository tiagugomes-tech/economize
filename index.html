<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B7A55">
<meta name="description" content="Controle das faturas de cartão, parcelas e vencimentos. Seus dados ficam só no seu aparelho.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Economize">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Economize</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: app de uma coluna larga — cabeçalho com mês, abas no topo (desktop) ou embaixo (celular); resumo em duas colunas, livro-razão com linhas pautadas */
:root {
  --bg: #F2F5F3;
  --surface: #FFFFFF;
  --surface-2: #F7FAF8;
  --ink: #111917;
  --muted: #56645F;
  --line: #D8E1DC;
  --rule: #E5ECE8;
  --accent: #0B7A55;
  --accent-ink: #FFFFFF;
  --accent-soft: #D9F1E6;
  --accent-2: #94CDB6;
  --ok: #1E8449; --ok-soft: #DDF2E4;
  --warn: #A86506; --warn-soft: #FBEBCF;
  --bad: #B93C1F; --bad-soft: #F9DDD5;
  --shadow: 0 1px 2px rgba(20, 40, 34, .06), 0 6px 18px -10px rgba(20, 40, 34, .18);
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
  /* paleta categórica validada (claro): casa, comida, transporte, compras/lazer, saúde/educação, pix, juros; g0 = neutro */
  --g1: #2a78d6; --g2: #eb6834; --g3: #1baf7a; --g4: #eda100; --g5: #e87ba4; --g6: #6250d6; --g7: #e34948; --g0: #9aa29e;
  --in: #1E8449;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B0D0D; --surface: #151919; --surface-2: #1B2020; --ink: #EAF1EE; --muted: #96A39E; --line: #262D2B; --rule: #1D2322;
    --accent: #34D399; --accent-ink: #04130D; --accent-soft: #0F3327; --accent-2: #2E7D62;
    --ok: #5DCB8A; --ok-soft: #173826; --warn: #E6A84A; --warn-soft: #3A2B12; --bad: #F08468; --bad-soft: #3D1E16;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 22px -12px rgba(0, 0, 0, .6);
    --g1: #3987e5; --g2: #d95926; --g3: #199e70; --g4: #c98500; --g5: #d55181; --g6: #9085e9; --g7: #e66767; --g0: #6f7874;
    --in: #5DCB8A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --g1: #3987e5; --g2: #d95926; --g3: #199e70; --g4: #c98500; --g5: #d55181; --g6: #9085e9; --g7: #e66767; --g0: #6f7874;
  --in: #5DCB8A;
  --bg: #0B0D0D; --surface: #151919; --surface-2: #1B2020; --ink: #EAF1EE; --muted: #96A39E; --line: #262D2B; --rule: #1D2322;
  --accent: #34D399; --accent-ink: #04130D; --accent-soft: #0F3327; --accent-2: #2E7D62;
  --ok: #5DCB8A; --ok-soft: #173826; --warn: #E6A84A; --warn-soft: #3A2B12; --bad: #F08468; --bad-soft: #3D1E16;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 22px -12px rgba(0, 0, 0, .6);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; clip: rect(0 0 0 0); }
.money, .num, .mono, .big, .val { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--f-mono); font-size: .86em; }

/* topo */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
.top-in { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px; display: flex; align-items: center; gap: 12px 18px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
.brand-mark { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
.brand-mark svg { width: 18px; height: 18px; }
.brand h1 { font-family: var(--f-display); font-weight: 700; font-size: 1.28rem; letter-spacing: -.01em; margin: 0; }
#month { display: flex; align-items: center; gap: 2px; }
.month-label { background: none; border: 0; font-family: var(--f-display); font-weight: 600; font-size: 1.02rem; padding: 6px 8px; cursor: pointer; border-radius: 8px; min-width: 10.5em; text-align: center; }
.month-label:hover { background: var(--surface-2); }
.icon-btn { background: none; border: 1px solid transparent; border-radius: 8px; width: 34px; height: 34px; display: grid; place-items: center; cursor: pointer; color: var(--muted); }
.icon-btn:hover { background: var(--surface); border-color: var(--line); color: var(--ink); }
.icon-btn.sm { width: 28px; height: 28px; }
.icon-btn.sm svg { width: 15px; height: 15px; }
.chip { font-size: .76rem; padding: 4px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.chip.ok::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); margin-right: 6px; vertical-align: 1px; }
.chip.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }

.tabs { display: flex; gap: 4px; max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.tab { display: flex; align-items: center; gap: 7px; padding: 9px 12px 10px; color: var(--muted); text-decoration: none; font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab:hover { color: var(--ink); }
.tab[aria-current="page"] { color: var(--accent); border-bottom-color: var(--accent); }

main { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 48px; }
#app { display: flex; flex-direction: column; gap: 16px; }

/* blocos */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; box-shadow: var(--shadow); min-width: 0; }
.panel-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
h2 { font-family: var(--f-display); font-weight: 600; font-size: 1.08rem; margin: 0; letter-spacing: -.005em; text-wrap: balance; }
.muted { color: var(--muted); font-size: .86rem; }
.eyebrow, .lbl { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.empty { color: var(--muted); padding: 14px; border: 1px dashed var(--line); border-radius: 8px; font-size: .92rem; }
.note { margin-top: 14px; padding: 10px 12px; border-radius: 8px; background: var(--surface-2); font-size: .9rem; color: var(--muted); }
.note strong { color: var(--ink); }
.bad-note { background: var(--bad-soft); color: var(--ink); }
.hint-p { color: var(--muted); font-size: .88rem; margin: -4px 0 12px; max-width: 65ch; }
.row { display: flex; gap: 8px; align-items: center; }
.row.wrap { flex-wrap: wrap; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; background: var(--accent); color: var(--accent-ink); border: 1px solid var(--accent); border-radius: 8px; padding: 8px 14px; font-weight: 600; font-size: .9rem; cursor: pointer; white-space: nowrap; }
.btn:hover { filter: brightness(1.06); }
.btn:disabled { opacity: .6; cursor: progress; }
.btn.sm { padding: 5px 10px; font-size: .82rem; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.ghost:hover { background: var(--surface-2); }
.btn.ghost-ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.btn.bad { background: var(--bad); border-color: var(--bad); color: #fff; }
.link { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; cursor: pointer; font-size: .88rem; }
.link:hover { text-decoration: underline; }
.link.muted { color: var(--muted); font-weight: 500; }
.back { display: inline-flex; align-items: center; gap: 4px; align-self: flex-start; }

.banner { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); padding: 11px 14px; border-radius: var(--r); font-size: .92rem; }
.banner-acts { margin-left: auto; }
.apoio { display: flex; gap: 14px; align-items: center; background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); padding: 14px; border-radius: var(--r); }
.apoio.fixo { background: var(--surface-2); border-color: var(--line); }
.apoio-foto { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; flex: none; border: 2px solid var(--surface); box-shadow: var(--shadow); }
.apoio-t { display: flex; flex-direction: column; gap: 6px; min-width: 0; font-size: .92rem; }
.apoio .pix small { display: block; color: var(--muted); font-size: .72rem; }
.apoio .pix code { display: block; font: .78rem/1.35 var(--f-mono); word-break: break-all; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; user-select: all; }
.passos .pbar { height: 8px; border-radius: 99px; background: var(--rule); overflow: hidden; margin: 6px 0 14px; }
.passos .pbar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.plist { list-style: none; margin: 0 0 8px; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.plist li { display: flex; gap: 12px; align-items: flex-start; }
.plist li > div { display: flex; flex-direction: column; gap: 3px; font-size: .92rem; min-width: 0; }
.plist .pchk { flex: none; width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: .8rem; font-weight: 700; color: var(--accent-ink); }
.plist li.done .pchk { background: var(--ok); border-color: var(--ok); }
.plist li.done b { color: var(--muted); font-weight: 600; }
.plist li.next .pchk { border-color: var(--accent); }
.plist .row { margin-top: 6px; }
.apoio-acts { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.loading { display: flex; align-items: center; gap: 10px; color: var(--muted); padding: 40px 0; justify-content: center; }
.spin { width: 16px; height: 16px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: sp 0.8s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }

/* resumo */
.grid-resumo { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.col-main, .col-side { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.hero-fig .big { font-family: var(--f-display); font-weight: 700; font-size: clamp(2.1rem, 5vw, 3rem); letter-spacing: -.02em; line-height: 1.05; margin: 6px 0 10px; }
.fig-sub { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--muted); font-size: .88rem; align-items: center; }
.sw { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 6px; vertical-align: 0; flex: none; }
.delta { font-weight: 600; font-size: .8rem; padding: 2px 8px; border-radius: 999px; }
.delta.up { background: var(--bad-soft); color: var(--bad); }
.delta.down { background: var(--ok-soft); color: var(--ok); }
.fig-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--rule); }
.val { font-size: 1.12rem; font-weight: 600; margin-top: 2px; }
.neg { color: var(--bad); }
.pos { color: var(--ok); }

.bars { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.bar-row { width: 100%; display: grid; grid-template-columns: minmax(110px, 11rem) minmax(40px, 1fr) auto 3.2em; gap: 12px; align-items: center; background: none; border: 0; padding: 7px 6px; border-radius: 7px; cursor: pointer; text-align: left; }
.bar-row:hover { background: var(--surface-2); }
.bar-row.on { background: var(--accent-soft); }
.bar-name { display: flex; align-items: center; font-size: .92rem; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar-track { height: 9px; background: var(--rule); border-radius: 5px; overflow: hidden; }
.bar-fill { display: block; height: 100%; border-radius: 5px; }
.bar-val { font-size: .9rem; font-weight: 600; text-align: right; }
.bar-pct { font-size: .8rem; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }

.ledger { list-style: none; margin: 0; padding: 0; }
.ledger li { display: grid; grid-template-columns: 3.4rem minmax(0, 1fr) auto; gap: 12px; align-items: baseline; padding: 9px 2px; border-bottom: 1px solid var(--rule); }
.ledger li:last-child { border-bottom: 0; }
.l-date { font-family: var(--f-mono); font-size: .8rem; color: var(--muted); }
.l-desc { min-width: 0; overflow-wrap: anywhere; }
.l-desc small, .t-desc + small, .due-n small, .item-n small, .fat-n small, .fat-v small { display: block; color: var(--muted); font-size: .78rem; margin-top: 1px; }
.l-val { font-weight: 600; }
.ledger.small li { padding: 6px 2px; font-size: .9rem; }
.tag { font-family: var(--f-mono); font-size: .72rem; padding: 1px 5px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }

.due { list-style: none; margin: 0; padding: 0; }
.due li { display: grid; grid-template-columns: 2.6rem minmax(0, 1fr) auto; grid-template-areas: "d n v" "d n s"; column-gap: 12px; row-gap: 3px; align-items: center; padding: 10px 2px; border-bottom: 1px solid var(--rule); }
.due li:last-child { border-bottom: 0; }
.due-d { grid-area: d; display: flex; flex-direction: column; align-items: center; line-height: 1; font-size: .7rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; border-left: 3px solid var(--line); padding: 3px 0 3px 2px; }
.due-d b { font-family: var(--f-display); font-size: 1.25rem; color: var(--ink); letter-spacing: 0; margin-bottom: 2px; }
.due-logo .due-d { border-left-color: var(--warn); }
.due-atrasado .due-d { border-left-color: var(--bad); }
.due-pago .due-d { border-left-color: var(--ok); }
.due-n { grid-area: n; min-width: 0; overflow-wrap: anywhere; font-weight: 500; }
.due-v { grid-area: v; justify-self: end; font-weight: 600; }
.due li > .pill { grid-area: s; justify-self: end; }
.due-act { grid-area: s; justify-self: end; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.due-full li { padding: 12px 2px; }
.due-pago .due-n { color: var(--muted); }
.pill { font-size: .72rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.pill.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.pill.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }

.cols-chart { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; height: 170px; align-items: end; }
.cc { display: flex; flex-direction: column; align-items: center; gap: 5px; height: 100%; justify-content: flex-end; min-width: 0; }
.cc-v { font-size: .72rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.cc-bar { width: 100%; max-width: 38px; flex: 1; display: flex; flex-direction: column-reverse; background: repeating-linear-gradient(to top, var(--rule) 0 1px, transparent 1px 25%); border-radius: 5px 5px 0 0; overflow: hidden; }
.cc-bar span { display: block; width: 100%; }
.cc-m { font-size: .76rem; color: var(--muted); text-transform: lowercase; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .78rem; color: var(--muted); margin-top: 12px; align-items: center; }
.alerts { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 8px; font-size: .9rem; }

/* calendário */
.cal-wrap { display: flex; flex-direction: column; gap: 16px; }
.cal-sum { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.progress { height: 6px; border-radius: 4px; background: var(--rule); margin-top: 14px; overflow: hidden; }
.progress span { display: block; height: 100%; background: var(--ok); border-radius: 4px; }
.cal-head, .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal-head span { font-size: .72rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); padding: 0 6px 6px; font-weight: 600; }
.cal-c { position: relative; min-height: 86px; border: 1px solid var(--rule); border-radius: 7px; background: var(--surface); padding: 5px; display: flex; flex-direction: column; gap: 3px; text-align: left; cursor: pointer; min-width: 0; }
.cal-c.blank { border-color: transparent; background: transparent; cursor: default; }
.cal-c:hover:not(.blank) { border-color: var(--line); background: var(--surface-2); }
.cal-c.has { background: var(--surface-2); }
.cal-c.sel { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.cal-n { font-size: .8rem; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
.cal-c.today .cal-n { background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 0 6px; align-self: flex-start; }
.cal-e { display: block; font-size: .7rem; line-height: 1.25; padding: 2px 5px; border-radius: 4px; border-left: 3px solid var(--muted); background: var(--surface); min-width: 0; }
.cal-et { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cal-e.s-logo { border-left-color: var(--warn); }
.cal-e.s-atrasado { border-left-color: var(--bad); background: var(--bad-soft); }
.cal-e.s-pago { border-left-color: var(--ok); color: var(--muted); text-decoration: line-through; }
.cal-more { font-size: .68rem; color: var(--muted); }
.cal-dots { display: none; gap: 3px; flex-wrap: wrap; }
.cal-dots i, .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); display: inline-block; }
.dot { margin-right: 5px; vertical-align: 0; }
.s-logo.dot, .cal-dots i.s-logo { background: var(--warn); }
.s-atrasado.dot, .cal-dots i.s-atrasado { background: var(--bad); }
.s-pago.dot, .cal-dots i.s-pago { background: var(--ok); }
.cal-best { position: absolute; top: 4px; right: 6px; font-size: .72rem; color: var(--warn); }

/* faturas */
.import { padding: 0; overflow: hidden; }
.drop { display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto; column-gap: 14px; padding: 20px; cursor: pointer; border: 2px dashed transparent; border-radius: var(--r); transition: background .15s; }
.drop:hover { background: var(--surface-2); border-color: var(--line); }
.drop-ic { grid-row: span 2; width: 38px; height: 38px; padding: 8px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); }
.drop-t { font-family: var(--f-display); font-weight: 600; font-size: 1.08rem; }
.drop-s { color: var(--muted); font-size: .86rem; max-width: 62ch; }
.import.busy .drop-ic { animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .45; } }
.pwd { padding: 0 20px 18px; display: flex; flex-direction: column; gap: 8px; font-size: .9rem; }
.pwd input { flex: 1; min-width: 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); }

.fat-list, .items { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.fat-row, .item { width: 100%; display: flex; align-items: center; gap: 12px; background: none; border: 0; border-bottom: 1px solid var(--rule); padding: 12px 4px; text-align: left; cursor: pointer; }
.fat-list li:last-child .fat-row, .items li:last-child .item { border-bottom: 0; }
.fat-row:hover, .item:hover { background: var(--surface-2); }
.fat-n, .item-n { flex: 1; min-width: 0; font-weight: 500; overflow-wrap: anywhere; }
.fat-v { text-align: right; font-weight: 600; }
.item-v { font-weight: 600; }
.bank { width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; font-size: .82rem; flex: none; color: #fff; background: #6B7A74; }
.bank.lg { width: 44px; height: 44px; font-size: 1rem; }
.b-itau { background: #EC7000; font-size: .7rem; }
.bank.lg.b-itau { font-size: .86rem; }
.b-santander { background: #CC0000; }
.b-bb { background: #F2D11B; color: #23356E; }
.b-caixa { background: #005CA9; }
.b-nubank { background: #820AD1; }
.b-inter { background: #FF7A00; }
.b-renner { background: #D4001A; }
.b-porto { background: #0046C0; }
.paybox { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 10px 12px; border-radius: 8px; background: var(--surface-2); font-size: .9rem; }
.paybox.ok { background: var(--ok-soft); }
.paybox.bad { background: var(--bad-soft); }
.paybox .btn, .paybox .link { margin-left: auto; }
.paydate { display: inline-flex; align-items: center; gap: 6px; }
.paydate input { font: inherit; font-size: .88rem; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); }
.fat-row .pill { flex: none; }
.cat-dot { width: 12px; height: 12px; border-radius: 4px; flex: none; margin: 0 11px; }
.stamp { font-family: var(--f-mono); font-size: .66rem; text-transform: uppercase; letter-spacing: .12em; font-weight: 500; color: var(--ok); border: 1.5px solid currentColor; border-radius: 4px; padding: 2px 6px; transform: rotate(-3deg); display: inline-block; flex: none; }
.stamp.warn { color: var(--warn); }
.best { display: flex; flex-direction: column; align-items: flex-end; font-size: .7rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; line-height: 1.2; }
.best b { font-family: var(--f-display); font-size: 1.2rem; color: var(--warn); letter-spacing: 0; }

.fat-head h2 { font-size: 1.25rem; }
.fh-top { display: flex; gap: 14px; align-items: center; }
.check { margin-top: 14px; display: flex; gap: 12px; align-items: center; font-size: .9rem; padding: 10px 12px; border-radius: 8px; background: var(--surface-2); flex-wrap: wrap; }
.check.ok { background: var(--ok-soft); }
.check.bad { background: var(--bad-soft); }
.ph-acts { display: flex; gap: 8px; }

.tbl-wrap { overflow-x: auto; margin: 0 -4px; }
table.tx { width: 100%; border-collapse: collapse; min-width: 560px; }
.tx th { font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; text-align: left; padding: 6px 8px; border-bottom: 1.5px solid var(--line); }
.tx td { padding: 9px 8px; border-bottom: 1px solid var(--rule); vertical-align: top; }
.tx td small { display: block; color: var(--muted); font-size: .76rem; margin-top: 2px; }
.tx .num { text-align: right; white-space: nowrap; font-weight: 600; }
.tx tfoot td { font-weight: 700; border-bottom: 0; border-top: 1.5px solid var(--line); }
.t-desc { overflow-wrap: anywhere; }
.sel-wrap { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 7px; padding: 0 0 0 8px; background: var(--surface); }
.sel-wrap select { border: 0; background: transparent; padding: 5px 6px 5px 0; font-size: .86rem; cursor: pointer; max-width: 12rem; }
.tx small.src { font-size: .7rem; }
.fut { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
.fut-m { border: 1px solid var(--rule); border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; font-size: .78rem; color: var(--muted); text-transform: lowercase; }
.fut-m b { color: var(--ink); font-size: .95rem; text-transform: none; }
.danger-zone { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: .9rem; padding: 0 4px; }

/* cadastro */
.form { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; padding: 14px; margin-bottom: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); }
.items .editing .form { margin: 8px 0; }
.fld { display: flex; flex-direction: column; gap: 4px; font-size: .78rem; color: var(--muted); font-weight: 600; min-width: 0; }
.fld input, .fld select { font-size: .95rem; font-weight: 400; color: var(--ink); padding: 8px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); width: 100%; min-width: 0; }
.form-acts { grid-column: 1 / -1; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.confirm { display: inline-flex; gap: 8px; align-items: center; font-size: .88rem; flex-wrap: wrap; }
.rules { list-style: none; margin: 0; padding: 0; }
.rules li { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 7px 2px; border-bottom: 1px solid var(--rule); }
.rules li:last-child { border-bottom: 0; }
.rules .mono { overflow-wrap: anywhere; }
.r-cat { display: flex; align-items: center; font-size: .88rem; }
.r-cat small { color: var(--muted); margin-left: 4px; }

/* tela de senha */
body.is-locked .top, body.is-locked main { display: none; }
#lock { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 40px; background: radial-gradient(120% 70% at 50% 0%, var(--accent-soft), transparent 70%), var(--bg); }
#lock[hidden] { display: none !important; }
.lock-card { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 28px 24px 22px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 14px; }
.lock-brand { display: flex; align-items: center; gap: 10px; font-family: var(--f-display); font-weight: 700; font-size: 1.15rem; }
.lock-h { font-size: 1.5rem; letter-spacing: -.015em; margin-top: 6px; }
.lock-p { margin: -6px 0 0; color: var(--muted); font-size: .92rem; }
.keep-row { display: flex; gap: 10px; align-items: flex-start; font-size: .92rem; cursor: pointer; }
.keep-row input { width: 20px; height: 20px; margin-top: 2px; flex: none; }
.keep-row small { display: block; color: var(--muted, #667); font-size: .78rem; margin-top: 2px; }
.lock-form { display: flex; flex-direction: column; gap: 12px; }
.lock-form .fld input { font-size: 1.05rem; padding: 11px 12px; background: var(--surface-2); }
.pw { position: relative; display: block; }
.pw input { padding-right: 44px !important; }
.pw-eye { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 36px; height: 36px; display: grid; place-items: center; background: none; border: 0; color: var(--muted); cursor: pointer; border-radius: 6px; }
.btn.lg { padding: 12px 16px; font-size: 1rem; margin-top: 4px; }
.lock-msg { color: var(--bad); font-size: .88rem; font-weight: 500; }
.lock-forgot { border-top: 1px solid var(--rule); padding-top: 12px; font-size: .88rem; color: var(--muted); }
.lock-forgot p { margin: 0 0 10px; }
.lock-foot { color: var(--muted); font-size: .8rem; margin: 0; text-align: center; max-width: 380px; }
.onboard { padding: 26px; }
.onboard-h { font-size: 1.45rem; margin: 6px 0 10px; }
.steps { margin: 4px 0 20px; padding-left: 20px; display: flex; flex-direction: column; gap: 10px; max-width: 62ch; }

#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: .9rem; max-width: min(92vw, 520px); box-shadow: var(--shadow); z-index: 50; }
#copybox { position: fixed; inset: auto 16px calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 60; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 8px; max-width: 640px; margin: 0 auto; }
#copybox[hidden] { display: none !important; }
#copybox textarea { width: 100%; height: 160px; font-family: var(--f-mono); font-size: .76rem; border: 1px solid var(--line); border-radius: 6px; background: var(--surface-2); color: var(--ink); padding: 8px; }

@media (max-width: 860px) {
  .grid-resumo { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 720px) {
  .top { backdrop-filter: none; -webkit-backdrop-filter: none; background: var(--bg); }
  .tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--surface); border-top: 1px solid var(--line); justify-content: space-around; gap: 0; padding-bottom: env(safe-area-inset-bottom, 0px); }
  .tab { flex-direction: column; gap: 2px; font-size: .7rem; padding: 8px 4px 9px; border-bottom: 0; border-top: 2px solid transparent; margin: -1px 0 0; flex: 1; }
  .tab[aria-current="page"] { border-top-color: var(--accent); }
  .tab svg { width: 20px; height: 20px; }
  main { padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
  #toast { bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }
  .top-in { padding-block: 8px; }
  #month { order: 3; width: 100%; justify-content: space-between; }
  .month-label { flex: 1; }
  .bar-row { grid-template-columns: minmax(0, 1fr) auto 2.6em; grid-template-areas: "n v p" "t t t"; row-gap: 5px; }
  .bar-name { grid-area: n; } .bar-val { grid-area: v; } .bar-pct { grid-area: p; } .bar-track { grid-area: t; }
  .cal-c { min-height: 54px; padding: 4px; }
  .cal-e, .cal-more { display: none; }
  .cal-dots { display: flex; margin-top: auto; }
  .cal-sum .val { font-size: .98rem; }
  .panel { padding: 14px; }
  .fat-row .stamp { display: none; }
  .best { display: none; }
  .fat-row { flex-wrap: wrap; row-gap: 6px; }
  .fat-n { flex: 1 1 calc(100% - 50px); }
  .fat-v { margin-left: 46px; text-align: left; display: flex; flex-direction: column; }
  .fat-row .pill { margin-left: auto; }
  .top-in { gap: 8px 10px; }
  #sync .chip { font-size: .7rem; padding: 3px 8px; }
}

/* ===== painel (v2) ===== */
.dash { display: flex; flex-direction: column; gap: 16px; }
.row-2 { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.col-stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.balance { padding: 20px 20px 18px; background: linear-gradient(135deg, var(--accent-soft), var(--surface) 62%); }
.bal-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.bal-figs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 14px 0 16px; }
.bal-fig { display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); text-align: left; min-width: 0; }
button.bal-fig { cursor: pointer; }
button.bal-fig:hover { border-color: var(--accent); }
.bal-v { font-family: var(--f-display); font-weight: 700; font-size: clamp(1.15rem, 3.4vw, 1.75rem); letter-spacing: -.015em; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bal-fig small { color: var(--muted); font-size: .76rem; }
.bal-fig.in .bal-v, .pos-ink { color: var(--in); }
.bal-fig.res.pos { background: var(--ok-soft); border-color: transparent; }
.bal-fig.res.pos .bal-v { color: var(--ok); }
.bal-fig.res.neg { background: var(--bad-soft); border-color: transparent; }
.bal-fig.res.neg .bal-v { color: var(--bad); }
.gauge-track { position: relative; height: 12px; border-radius: 6px; background: var(--rule); overflow: hidden; }
.gauge-track span { display: block; height: 100%; border-radius: 6px; background: var(--ok); transition: width .5s ease; }
.gauge.warn .gauge-track span { background: var(--warn); }
.gauge.bad .gauge-track span { background: var(--bad); }
.gauge-track .over { position: absolute; right: 0; top: 0; bottom: 0; width: 10px; background: repeating-linear-gradient(135deg, var(--surface) 0 2px, transparent 2px 5px); }
.gauge-txt { margin-top: 8px; font-size: .88rem; color: var(--muted); }
.gauge-txt b { color: var(--ink); font-variant-numeric: tabular-nums; }
.gauge.ok .g-st { color: var(--ok); font-weight: 600; }
.gauge.warn .g-st { color: var(--warn); font-weight: 600; }
.gauge.bad .g-st { color: var(--bad); font-weight: 600; }

.donut-wrap { display: grid; grid-template-columns: minmax(150px, 210px) minmax(0, 1fr); gap: 18px; align-items: center; }
.donut { width: 100%; max-width: 210px; height: auto; display: block; margin: 0 auto; }
.donut .seg { cursor: pointer; transition: opacity .15s, stroke-width .15s; }
.donut .seg:hover, .donut .seg.on { stroke-width: 30; }
.donut .seg.dim { opacity: .3; }
.donut .seg:focus-visible { outline: none; stroke-width: 31; }
.d-lbl { font-family: var(--f-body); font-size: 11px; fill: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.d-val { font-family: var(--f-display); font-weight: 700; font-size: 14.5px; fill: var(--ink); }
.legend-l { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.lg-row { width: 100%; display: grid; grid-template-columns: auto minmax(0, 1fr) auto 2.6em; align-items: center; gap: 8px; background: none; border: 0; padding: 6px 6px; border-radius: 7px; cursor: pointer; text-align: left; font-size: .88rem; }
.lg-row:hover { background: var(--surface-2); }
.lg-row.on { background: var(--accent-soft); }
.lg-n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lg-v { font-weight: 600; }
.lg-p { color: var(--muted); font-size: .8rem; text-align: right; font-variant-numeric: tabular-nums; }

.insights { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.tile-ic { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); margin-bottom: 6px; }
.tile-ic.warn { background: var(--warn-soft); color: var(--warn); }
.tile-ic svg { width: 17px; height: 17px; }
.tile-v { font-family: var(--f-display); font-weight: 700; font-size: 1.55rem; letter-spacing: -.015em; line-height: 1.15; overflow-wrap: anywhere; }
.tile-v.sm { font-size: 1.1rem; }
.tile-s { font-size: .8rem; color: var(--muted); }

.parc-list { list-style: none; margin: 0 0 6px; padding: 0; display: flex; flex-direction: column; }
.parc-list li { padding: 10px 0; border-bottom: 1px solid var(--rule); }
.parc-list li:last-child { border-bottom: 0; }
.pl-top { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.pl-n { min-width: 0; overflow-wrap: anywhere; font-weight: 500; }
.pl-n small { display: block; color: var(--muted); font-size: .76rem; font-weight: 400; }
.pl-v { text-align: right; font-weight: 600; white-space: nowrap; }
.pl-v small { color: var(--muted); font-weight: 400; font-size: .74rem; margin-left: 2px; }
.pl-bar { height: 6px; border-radius: 3px; background: var(--rule); margin: 8px 0 5px; overflow: hidden; }
.pl-bar span { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.pl-meta { font-size: .76rem; color: var(--muted); }

.cc-bar { position: relative; display: block; flex: none; height: 120px; overflow: visible; }
.cc-bar .cc-fill { position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column-reverse; gap: 2px; border-radius: 4px 4px 0 0; overflow: hidden; }
.cc-bar .cc-fill span { display: block; width: 100%; min-height: 0; }
.cc-line { position: absolute; left: -4px; right: -4px; height: 0; border-top: 2px dashed var(--in); }
.legend .ln { display: inline-block; width: 14px; border-top: 2px dashed var(--in); margin-right: 6px; vertical-align: 3px; }

.cbars { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.cbars li { display: grid; grid-template-columns: auto minmax(70px, 9rem) minmax(30px, 1fr) auto; gap: 10px; align-items: center; font-size: .88rem; }
.cb-n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cb-track { height: 8px; border-radius: 4px; background: var(--rule); overflow: hidden; }
.cb-track span { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.cb-v { font-weight: 600; text-align: right; }
.bank.xs { width: 24px; height: 24px; border-radius: 6px; font-size: .6rem; }
.bank.xs.b-itau { font-size: .5rem; }
.ledger .sw { width: 7px; height: 7px; margin-right: 4px; }

/* entradas */
.inc-hero { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px 24px; flex-wrap: wrap; background: linear-gradient(135deg, var(--ok-soft), var(--surface) 65%); }
.inc-hero .big { font-family: var(--f-display); font-weight: 700; font-size: clamp(2rem, 5vw, 2.6rem); letter-spacing: -.02em; margin: 4px 0 4px; }
.inc-sum { display: flex; gap: 22px; }
.inc-sum > div { display: flex; flex-direction: column; gap: 2px; }
.inc-sum .money { font-weight: 600; font-size: 1.1rem; }
.inc-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.inc { display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--rule); padding: 4px 0; }
.inc:last-child { border-bottom: 0; }
.inc-main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; background: none; border: 0; padding: 8px 4px; cursor: pointer; text-align: left; border-radius: 8px; }
.inc-main:hover { background: var(--surface-2); }
.inc .due-d { border-left-color: var(--in); width: 2.6rem; flex: none; }
.inc-v { font-weight: 600; color: var(--in); white-space: nowrap; }
.small-note { font-size: .8rem; margin: 8px 0 0; }
.due-in .due-d { border-left-color: var(--in); }
.pos { color: var(--ok); }
.cal-e.s-in { border-left-color: var(--in); color: var(--in); }
.cal-dots i.s-in, .dot.s-in { background: var(--in); }

@media (max-width: 900px) {
  .row-2 { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 720px) {
  .bal-figs { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .bal-fig.res { grid-column: 1 / -1; flex-direction: row; align-items: baseline; justify-content: space-between; flex-wrap: wrap; column-gap: 10px; }
  .donut-wrap { grid-template-columns: minmax(0, 1fr); }
  .donut { max-width: 190px; }
  .insights { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
  .tile { padding: 12px; }
  .tile-v { font-size: 1.25rem; }
  .cbars li { grid-template-columns: auto minmax(0, 1fr) auto; }
  .cbars .cb-track { grid-column: 1 / -1; order: 4; }
  .tab { font-size: .64rem; padding-inline: 2px; }
}

/* parcelas por mês */
.pc-sum { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 14px; }
.pc-sum > div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.pc-sum small { color: var(--muted); font-size: .76rem; }
.pc-big { font-family: var(--f-display); font-weight: 700; font-size: 1.3rem; letter-spacing: -.01em; }
.pc-scroll { overflow-x: auto; margin: 0 -4px; padding: 0 4px 4px; }
.pc-chart { display: grid; gap: 6px; align-items: end; min-height: 210px; background: linear-gradient(to top, var(--rule) 1px, transparent 1px) 0 calc(100% - 38px) / 100% 25% repeat-y; }
.pc-col { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
.pc-v { font-size: .7rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.pc-bar { position: relative; display: block; width: 100%; max-width: 44px; height: 150px; }
.pc-bar span { position: absolute; left: 0; right: 0; bottom: 0; background: var(--accent); border-radius: 4px 4px 0 0; transition: height .4s ease; }
.pc-col:not(.now) .pc-bar span { background: color-mix(in srgb, var(--accent) 72%, var(--surface)); }
.pc-col.now .pc-v { color: var(--ink); font-weight: 600; }
.pc-col:hover .pc-bar span { background: var(--accent); }

<script>
/* ===== Leitor de faturas (independente da interface) ===== */
const Parser = (() => {
  const VAL = /-?\d{1,3}(?:\.\d{3})*,\d{2}/;
  const num = (s) => {
    if (s == null) return null;
    const m = String(s).match(VAL);
    if (!m) return null;
    return Math.round(parseFloat(m[0].replace(/\./g, '').replace(',', '.')) * 100) / 100;
  };
  const strip = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '');

  /* Junta os pedaços de texto do PDF em linhas, respeitando colunas */
  function pageLines(items, width, opts = {}) {
    const its = items
      .filter((it) => it.str && it.str.trim() && !(/^[PSLE=+]$/.test(it.str.trim()) && (it.width || 0) < 6))
      .map((it) => ({ s: it.str, x: it.transform[4], y: it.transform[5], w: it.width || it.str.length * 4 }));
    if (!its.length) return [];
    // 1º: colunas de lançamentos, ancoradas nas datas "dd/mm" que abrem cada linha
    let split = null;
    const anchors0 = opts.rows ? [] : null;
    const anchors = its.filter((i) => /^\d{2}\/\d{2}$/.test(i.s.trim())).map((i) => i.x).sort((a, b) => a - b);
    if (!opts.rows && anchors.length >= 4) {
      const groups = [];
      for (const x of anchors) { const g = groups.find((g) => Math.abs(g.x - x) < 12); if (g) { g.n++; } else groups.push({ x, n: 1 }); }
      const big = groups.filter((g) => g.n >= 2).sort((a, b) => a.x - b.x);
      if (big.length >= 2 && big[big.length - 1].x - big[0].x > width * 0.25) {
        const right = big.find((g) => g.x - big[0].x > width * 0.25);
        split = right.x - 3;
      }
    }
    // 2º: procura uma "calha" vertical entre colunas
    const narrow = its.filter((i) => i.w < width * 0.45);
    let best = Infinity, bestX = null;
    for (let x = width * 0.35; x <= width * 0.68; x += 4) {
      let c = 0;
      for (const i of narrow) if (i.x < x + 4 && i.x + i.w > x) c++;
      if (c < best) { best = c; bestX = x + 2; }
    }
    if (!opts.rows && split == null && bestX != null) {
      const left = its.filter((i) => i.x + i.w <= bestX).length;
      const right = its.filter((i) => i.x >= bestX).length;
      if (best <= its.length * 0.04 && left > its.length * 0.15 && right > its.length * 0.15) split = bestX;
    }
    // Santander: o detalhamento tem duas colunas lado a lado (a da direita continua a da esquerda)
    if (opts.cols && its.some((i) => /Detalhamento da Fatura/i.test(i.s))) split = width * 0.47;
    const cols = split == null ? [its] : [its.filter((i) => i.x < split), its.filter((i) => i.x >= split)];
    const out = [];
    for (const col of cols) {
      col.sort((a, b) => b.y - a.y || a.x - b.x);
      const rows = [];
      for (const it of col) {
        const r = rows.length ? rows[rows.length - 1] : null;
        if (r && Math.abs(r.y - it.y) <= (opts.rows ? 3.5 : 2.5)) r.items.push(it);
        else rows.push({ y: it.y, items: [it] });
      }
      for (const r of rows) {
        r.items.sort((a, b) => a.x - b.x);
        let s = '', end = null;
        for (const it of r.items) {
          if (end != null) s += it.x - end > (opts.gap && it.x - end > 14 ? 14 : 1.2) ? (opts.gap && it.x - end > 14 ? ' \u00a6 ' : ' ') : '';
          s += it.s;
          end = it.x + it.w;
        }
        s = s.replace(/\s+/g, ' ').trim();
        if (s) out.push(s);
      }
    }
    return out;
  }

  function detectBank(text) {
    const t = strip(text).toLowerCase();
    if (/portoseg|cartao porto|cartaoportoseguro|porto seguro cia|whatsapp oficial da porto/.test(t)) return 'porto';
    if (/documento auxiliar de nota fiscal de agua/.test(t)) return 'caern';
    if (/documento auxiliar da nota fiscal de energia eletrica/.test(t)) return 'cosern';
    if (/carrefour/.test(t)) return 'carrefour';
    if (/picpay/.test(t)) return 'picpay';
    if (/c6 bank|banco c6|c6 platinum|c6 black|c6 carbon|c6 mastercard|c6 visa/.test(t)) return 'c6';
    if (/realize sociedade de credito|cartoes renner|lojas renner|meu cartao/.test(t)) return 'renner';
    if (/nubank|nu pagamentos/.test(t)) return 'nubank';
    if (/banco xp|cartao xp|xp visa|xp investimentos/.test(t)) return 'xp';
    if (/banco bv|\bbv mais\b|votorantim/.test(t)) return 'bv';
    if (/itau unibanco|itaucard|itau cartoes|\bitau\b/.test(t)) return 'itau';
    if (/santander/.test(t)) return 'santander';
    if (/banco do brasil|ourocard/.test(t)) return 'bb';
    if (/caixa economica|caixa\b/.test(t)) return 'caixa';
    if (/nubank|nu pagamentos/.test(t)) return 'nubank';
    if (/banco inter\b/.test(t)) return 'inter';
    return 'outro';
  }

  const DATE = /(\d{2})\/(\d{2})\/(\d{4})/;
  const iso = (m) => (m ? `${m[3]}-${m[2]}-${m[1]}` : null);
  const TX = /^(\d{2})\/(\d{2})(?:\/\d{2,4})?\s+(.+?)\s+(-?\d{1,3}(?:\.\d{3})*,\d{2})$/;
  const PARC = /(?:\s(?:PARC(?:ELA)?\s*)?(\d{1,2})\s*(?:\/|DE)\s*(\d{1,2})|(?<=[A-Za-z])(\d{2})\/(\d{2}))$/i;

  function splitParcela(desc) {
    const m = desc.match(PARC);
    if (!m) return { desc: desc.trim(), parc: null };
    const n = +(m[1] || m[3]), t = +(m[2] || m[4]);
    if (!t || n > t || t > 99) return { desc: desc.trim(), parc: null };
    return { desc: desc.slice(0, m.index).trim(), parc: [n, t] };
  }

  // ano da compra a partir do vencimento da fatura
  function txDate(dd, mm, venc) {
    const vy = +venc.slice(0, 4), vm = +venc.slice(5, 7);
    const vd = +venc.slice(8, 10);
    const y = +mm > vm || (+mm === vm && +dd > vd) ? vy - 1 : vy;
    return `${y}-${mm}-${dd}`;
  }

  function header(lines, text) {
    const h = {};
    const find = (re) => { for (const l of lines) { const m = l.match(re); if (m) return m; } return null; };
    let m = find(/Vencimento:?\s*(\d{2}\/\d{2}\/\d{4})/i);
    if (!m) {
      for (let i = 0; i < lines.length && !m; i++) {
        if (!/vencimento|vence em/i.test(lines[i])) continue;
        for (let k = i; k < i + 3 && k < lines.length; k++) { const d = lines[k].match(DATE); if (d) { m = [0, d[0]]; break; } }
      }
    }
    h.venc = m ? iso(m[1].match(DATE)) : null;
    if (/santander/i.test(text)) { const sv = text.match(/Total a Pagar[\s\S]{0,300}?R\$\s*[\d.]+,\d{2}\s+(\d{2}\/\d{2}\/\d{4})/); if (sv) h.venc = iso(sv[1].match(DATE)); }

      const t = find(/^Total da Fatura\s+R\$/i);
      if (t != null) { h.total = t; h.totalLanc = t; }
      const f = find(/^futuras\s+R\$/i); if (f != null) h.totalFuturo = f;
      const lr = rows.map((l) => l.match(/^Limite [uú]nico\s+R\$\s*([\d.]+,\d{2})/i)).find(Boolean); if (lr) h.limite = num(lr[1]);
      const pm = rows.map((l) => l.match(/^([A-Za-zÀ-ÿ][A-Za-zÀ-ÿ .'&-]{4,60}?)\s*\(Cart[ãa]o\s*\d{4}\)/)).find(Boolean);
      if (pm) { h.titular = pm[1].trim(); h.ident = pm[1].normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase().replace(/[^A-Z0-9 ]/g, '').replace(/\s+/g, ' ').trim(); }
    } else if (banco === 'c6') {
      const t = find(/^Total a pagar\b/i);
      if (t != null) { h.total = t; h.totalLanc = t; }
      // o cartão da fatura (final) vem no recibo do boleto; o titular, no campo PAGADOR
      const fm = rows.map((l) => l.match(/^(\d{4})\s+\d{6,}\s+\d{2}\/\d{2}\/\d{4}/)).find(Boolean);
      if (fm) h.final = fm[1];
      const pm = rows.map((l) => l.match(/PAGADOR:\s*([A-ZÀ-Ý][A-ZÀ-Ý .'&-]{5,}?)(?=\s*\(|\s{2,}|$)/)).find(Boolean);
      if (pm) { h.titular = pm[1].trim(); h.ident = pm[1].normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase().replace(/[^A-Z0-9 ]/g, '').replace(/\s+/g, ' ').trim(); }
    } else if (banco === 'santander') {
      const t = find(/^\(=\)\s*Saldo desta fatura/i);
      if (t != null) { h.total = t; h.totalLanc = t; }
    } else if (banco === 'xp') {
      const d = find(/^Despesas at[ée] a emiss[ãa]o/), t = find(/^Valor total devido/), lim = find(/^Limite total de cr[ée]dito/);
      if (d != null) h.totalLanc = d;
      if (t != null) h.total = t;
      if (lim != null) h.limite = lim;
    } else if (banco === 'bv') {
      const n = find(/^Total de lan[çc]amentos nacionais/), i2 = find(/^Total de lan[çc]amentos internacionais/);
      if (n != null) h.totalLanc = Math.round((n + (i2 || 0)) * 100) / 100;
      const t = find(/^Total desta fatura/); if (t != null) h.total = t;
      const lim = find(/^Limite total/); if (lim != null) h.limite = lim;
    } else if (banco === 'renner') {
      const c = find(/^Compras \/ D[ée]bitos/i); if (c != null) h.totalLanc = c;
      const t = find(/^Total R\$/i); if (t != null) h.total = t;
      const f = find(/^Total para as pr[óo]ximas faturas/i); if (f != null) h.totalFuturo = f;
    } else {
      if (h.totalLanc == null) { const c = find(/^total (dos )?lan[çc]amentos|^total de compras|^compras \/ d[ée]bitos/i); if (c != null) h.totalLanc = c; }
    }
    if (!h.proxFech) {
      const i = rows.findIndex((l) => /pr[óo]ximo fechamento|fechamento da pr[óo]xima fatura/i.test(l));
      if (i >= 0) for (let k = i; k < i + 3 && k < rows.length; k++) {
        let m = rows[k].match(/(\d{2})\/(\d{2})(?:\/(\d{4}))?/);
        if (m) { const y = m[3] || (+m[2] < +h.venc.slice(5, 7) ? +h.venc.slice(0, 4) + 1 : h.venc.slice(0, 4)); h.proxFech = `${y}-${m[2]}-${m[1]}`; break; }
        m = rows[k].match(/(\d{2}) (JAN|FEV|MAR|ABR|MAI|JUN|JUL|AGO|SET|OUT|NOV|DEZ) (\d{4})/i);
        if (m) { h.proxFech = `${m[3]}-${pad2(MESN[m[2].toUpperCase()])}-${m[1]}`; break; }
      }
    }
  }

  /* banco informa só os totais por mês (Porto): descobre quais compras compõem cada total */
  function bankFuture(tx, meses, demais) {
    const cand = tx.filter((t) => t.tipo !== 'serv' && t.v > 0);
    const out = [];
    const subset = (alvo) => {
      const n = Math.min(cand.length, 14);
      for (let mask = 1; mask < 1 << n; mask++) {
        let s = 0; const pick = [];
        for (let i = 0; i < n; i++) if (mask & (1 << i)) { s += cand[i].v; pick.push(cand[i]); }
        if (Math.abs(s - alvo) < 0.02) return pick;
      }
      return null;
    };
    meses.forEach((v, i) => {
      const pick = subset(v);
      if (pick) pick.forEach((t) => out.push({ k: i + 1, desc: t.desc, parc: null, v: t.v }));
      else out.push({ k: i + 1, desc: 'Parcelas (total informado pelo banco)', parc: null, v });
    });
    if (demais > 0) {
      const k0 = meses.length + 1;
      const t = cand.find((c) => { const q = demais / c.v; return Math.abs(q - Math.round(q)) < 0.001 && Math.round(q) <= 48; });
      if (t) {
        const q = Math.round(demais / t.v);
        for (let j = 0; j < q; j++) out.push({ k: k0 + j, desc: t.desc, parc: null, v: t.v });
        out[out.length - 1].v = Math.round((t.v + demais - q * t.v) * 100) / 100; // ajusta os centavos para bater com o banco
      }
      else out.push({ k: k0, desc: 'Demais parcelas (o banco não detalha os meses)', parc: null, v: demais });
    }
    return out;
  }

  /* pages: array de { items, width } (saída do pdf.js) */
  /* contas de consumo (água e luz): não são fatura de cartão, viram uma conta com valor do mês */
  function parseConta(text, lines, banco) {
    const num2 = (s) => Math.round(parseFloat(String(s).replace(/\./g, '').replace(',', '.')) * 100) / 100;
    let nome, total = null, venc = null, ref = null, chave = null;
    if (banco === 'caern') {
      nome = 'CAERN (água)';
      let m = text.match(/TOTAL A PAGAR\s+([\d.]+,\d{2})/i); if (m) total = num2(m[1]);
      m = text.match(/VENCIMENTO\s+(\d{2})\/(\d{2})\/(\d{4})/i); if (m) venc = `${m[3]}-${m[2]}-${m[1]}`;
      m = text.match(/M[ÊE]S\s+([A-Z]{3})\/(\d{2})/); if (m && MESN[m[1]]) ref = `20${m[2]}-${pad2(MESN[m[1]])}`;
      m = text.match(/MATR[ÍI]CULA\s+([\d.]+)/i); if (m) chave = m[1];
    } else {
      nome = 'COSERN (energia)';
      const m = text.match(/(\d{2})\/(\d{4})\s+([\d.]+,\d{2})\s+(\d{2})\/(\d{2})\/(\d{4})/);
      if (m) { ref = `${m[2]}-${m[1]}`; total = num2(m[3]); venc = `${m[6]}-${m[5]}-${m[4]}`; }
      const k = text.match(/C[ÓO]DIGO DO CLIENTE[\s\S]{0,60}?(\d{9,12})/i) || text.match(/\b(7\d{9})\b/); if (k) chave = k[1];
    }
    if (!venc || total == null) return { ok: false, banco, erro: 'Reconheci a conta de ' + (banco === 'caern' ? 'água' : 'luz') + ', mas não achei o vencimento ou o valor.', lines };
    return { ok: true, conta: true, banco, nome, venc, total, ref, chave: chave || banco, tx: [], pags: [], futuro: [], lines };
  }

  function parse(pages) {
    const lines = pages.flatMap((p) => pageLines(p.items, p.width));
    const text = lines.join('\n');
    const banco = detectBank(text);
    if (banco === 'caern' || banco === 'cosern') return parseConta(text, lines, banco);
    const rows = banco === 'itau' ? null : pages.flatMap((p) => pageLines(p.items, p.width, { rows: true, gap: banco === 'bv', cols: banco === 'santander' }));
    const h = header(lines, text);
    if (!h.venc) {
      const m = (rows || lines).join('\n').match(/(?:vencimento:?|FATURA)\s*(\d{2}) (JAN|FEV|MAR|ABR|MAI|JUN|JUL|AGO|SET|OUT|NOV|DEZ) (\d{4})/i);
      if (m) h.venc = `${m[3]}-${pad2(MESN[m[2].toUpperCase()])}-${m[1]}`;
    }
    if (!h.venc && banco === 'bb') { const m = text.match(/Vencimento[\s\S]{0,120}?(\d{2})\/(\d{2})\/(\d{4})/); if (m) h.venc = `${m[3]}-${m[2]}-${m[1]}`; }
    if (h.venc && rows) rowTotals(rows, h, banco);
    if (!h.venc) {
      return { ok: false, banco, erro: 'Não achei a data de vencimento. Esse PDF é mesmo uma fatura de cartão?', lines };
    }
    let r = banco === 'itau' ? parseItau(lines, h) : parseRows(rows, h, banco);
    if (!r.tx.length && banco !== 'itau') r = parseGeneric(lines, h);
    const soma = Math.round(r.tx.reduce((s, t) => s + t.v, 0) * 100) / 100;
    let conferido = null;
    if (h.totalLanc != null) conferido = Math.abs(soma - h.totalLanc) < 0.02;
    let futuroK = null;
    if (h.futBanco && h.futBanco.length) futuroK = bankFuture(r.tx, h.futBanco, h.futDemais || 0);
    const futuro = projectFuture({ tx: r.tx, futuro: r.futuro, futuroK });
    const somaFut = Math.round(futuro.reduce((s, f) => s + f.v, 0) * 100) / 100;
    let futuroConferido = null;
    if (h.totalFuturo != null) futuroConferido = Math.abs(somaFut - h.totalFuturo) < (banco === 'nubank' || banco === 'porto' || banco === 'bb' || banco === 'carrefour' ? 1 : 0.02);
    return {
      ok: r.tx.length > 0, banco, generico: !['itau', 'nubank', 'renner', 'bv', 'xp', 'santander', 'c6', 'bb', 'carrefour', 'picpay'].includes(banco), ...h, tx: r.tx, pags: r.pags, futuro: r.futuro || [], futuroK, soma, conferido, futuroConferido,
      erro: r.tx.length ? null : 'Li o PDF mas não encontrei lançamentos no formato esperado.', lines,
    };
  }

  /* fatura em CSV do Nubank: date,title,amount (valores como "1.234,56"; pagamentos negativos). Vencimento vem do nome do arquivo (ex.: Nubank_2026-12-08.csv) */
  function parseCsvNu(lines, fileName) {
    const f = String(fileName || '');
    let venc = null;
    const fm = f.match(/(\d{4})-(\d{2})-(\d{2})/);
    if (fm) venc = `${fm[1]}-${fm[2]}-${fm[3]}`;
    else { const f2 = f.match(/(\d{2})[-_.](\d{2})[-_.](\d{4})/); if (f2) venc = `${f2[3]}-${f2[2]}-${f2[1]}`; }
    if (!venc) return { ok: false, banco: 'nubank', erro: 'Não achei o vencimento. Deixe a data no nome do arquivo, como veio do Nubank (ex.: Nubank_2026-12-08.csv).', lines };
    const split = (l) => { const out = []; let cur = '', q = false; for (const ch of l) { if (ch === '"') q = !q; else if (ch === ',' && !q) { out.push(cur); cur = ''; } else cur += ch; } out.push(cur); return out.map((x) => x.trim()); };
    const tx = [], pags = [];
    for (const l of lines.slice(1)) {
      const c = split(l);
      const dm = (c[0] || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
      const vm = (c[c.length - 1] || '').match(/(\d{1,3}(?:\.\d{3})*,\d{2}|\d+\.\d{2})\s*$/);
      if (!dm || !vm) continue;
      const raw = c[c.length - 1];
      const neg = /-/.test(raw);
      const v = (neg ? -1 : 1) * (vm[1].includes(',') ? num(vm[1]) : parseFloat(vm[1]));
      const d = `${dm[1]}-${dm[2]}-${dm[3]}`;
      let title = c.slice(1, c.length - 1).join(',').replace(/\s+/g, ' ').trim();
      if (/^pagamento/i.test(title) && v < 0) { pags.push({ d, desc: title, v }); continue; }
      const { desc, parc } = cleanDesc(title);
      tx.push({ d, desc: desc || title, parc, v, tipo: /anuidade|iof|juros|tarifa|encargo|multa/i.test(desc) ? 'serv' : 'compra', hint: '' });
    }
    const soma = Math.round(tx.reduce((s, t) => s + t.v, 0) * 100) / 100;
    return {
      ok: tx.length > 0, banco: 'nubank', generico: false, venc, proxFech: null, emissao: null, total: soma, final: null,
      titular: null, ident: null, tx, pags, futuro: [], futuroK: null, soma, conferido: null, futuroConferido: null, csv: true,
      erro: tx.length ? null : 'Li o arquivo mas não achei lançamentos.', lines,
    };
  }

  /* fatura em CSV (XP): Data;Estabelecimento;Portador;Valor;Parcela. O vencimento vem do nome do arquivo (ex.: Fatura2026-12-05.csv) */
  function parseCsv(text, fileName) {
    const lines = text.replace(/^\uFEFF/, '').split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
    const head = (lines[0] || '').toLowerCase();
    if (/^date,title,amount/.test(head)) return parseCsvNu(lines, fileName);
    if (!/data/.test(head) || !/valor/.test(head) || !/estabelecimento|descri/.test(head)) return { ok: false, banco: 'outro', erro: 'Esse CSV não tem o formato esperado (Data; Estabelecimento; Portador; Valor; Parcela).', lines: [] };
    const cols = head.split(';').map((c) => c.trim());
    const ix = (re) => cols.findIndex((c) => re.test(c));
    const iD = ix(/^data/), iE = ix(/estabelecimento|descri/), iP = ix(/portador|titular/), iV = ix(/^valor/), iN = ix(/parcela/);
    let venc = null;
    const fm = String(fileName || '').match(/(\d{4})-(\d{2})-(\d{2})/) || null;
    if (fm) venc = `${fm[1]}-${fm[2]}-${fm[3]}`;
    else { const f2 = String(fileName || '').match(/(\d{2})[-_.](\d{2})[-_.](\d{4})/); if (f2) venc = `${f2[3]}-${f2[2]}-${f2[1]}`; }
    if (!venc) return { ok: false, banco: 'xp', erro: 'Não achei o vencimento. Deixe a data no nome do arquivo, como veio da XP (ex.: Fatura2026-12-05.csv).', lines };
    const tx = [], pags = [], portadores = new Set();
    for (const l of lines.slice(1)) {
      const c = l.split(';').map((x) => x.trim());
      const dm = (c[iD] || '').match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
      const vm = (c[iV] || '').match(/(-)?\s*(\d{1,3}(?:\.\d{3})*,\d{2})/);
      if (!dm || !vm) continue;
      const neg = /-/.test((c[iV] || '').replace(/R\$/, ''));
      const v = (neg ? -1 : 1) * num(vm[2]);
      const d = `${dm[3]}-${dm[2]}-${dm[1]}`;
      let desc = (c[iE] || '').replace(/\s+/g, ' ').trim();
      if (c[iP]) portadores.add(c[iP]);
      if (/^pagamento/i.test(desc) && v < 0) { pags.push({ d, desc, v }); continue; }
      const pm = (c[iN] || '').match(/(\d{1,2})\s*de\s*(\d{1,2})/i);
      const parc = pm && +pm[1] <= +pm[2] && +pm[2] > 1 ? [+pm[1], +pm[2]] : null;
      tx.push({ d, desc, parc, v, tipo: /anuidade|iof|juros|tarifa|encargo|multa/i.test(desc) ? 'serv' : 'compra', hint: '' });
    }
    const soma = Math.round(tx.reduce((s, t) => s + t.v, 0) * 100) / 100;
    const nrm = (x) => x.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase().replace(/[^A-Z0-9 ]/g, '').replace(/\s+/g, ' ').trim();
    const tit = portadores.size === 1 ? [...portadores][0] : null;
    const futuro = projectFuture({ tx });
    return {
      ok: tx.length > 0, banco: 'xp', generico: false, venc, proxFech: null, emissao: null, total: soma, final: null,
      titular: tit, ident: tit ? nrm(tit) : null, tx, pags, futuro: [], futuroK: null, soma, conferido: null, futuroConferido: null, csv: true,
      erro: tx.length ? null : 'Li o arquivo mas não achei lançamentos.', lines,
    };
  }

  /* parcelas que ainda virão, a partir das compras parceladas desta fatura.
     k = quantos meses depois do vencimento desta fatura */
  function projectFuture(f) {
    const out = [];
    if (f && f.futuroK && f.futuroK.length) return f.futuroK.map((x) => ({ ...x }));
    if (f && !Array.isArray(f) && f.futuro && f.futuro.length) {
      // lista do próprio banco: cada item é a parcela da PRÓXIMA fatura
      for (const t of f.futuro) {
        if (!t.parc) { out.push({ k: 1, desc: t.desc, parc: null, v: t.v }); continue; }
        const [n, tot] = t.parc;
        for (let p = n; p <= tot; p++) out.push({ k: 1 + p - n, desc: t.desc, parc: [p, tot], v: t.v });
      }
      return out;
    }
    const tx = Array.isArray(f) ? f : (f && f.tx) || [];
    for (const t of tx) {
      if (!t.parc) continue;
      const [n, tot] = t.parc;
      for (let p = n + 1; p <= tot; p++) out.push({ k: p - n, desc: t.desc, parc: [p, tot], v: t.v });
    }
    return out;
  }

  return { parse, parseCsv, pageLines, num, projectFuture, splitParcela, detectBank };
})();

  [/ANUIDADE|MENSALIDADE - PLANO|IOF|JUROS|TARIFA|ENCARGO|MULTA|SEGURO CARTAO|AVALIACAO EMERG/, 'tarifas'],
  [/ALUGUEL|IMOBILI|FINANCIAMENTO|HABITAC|MATERIAL DE CONST|CONSTRU|HOME CENTER/, 'moradia'],
];
const HINTS = [
  [/^restaurant/, 'alimentacao'], [/^transporte/, 'transporte'], [/^supermarket/, 'mercado'], [/^outros/, 'outros'],
  [/^alimenta/, 'alimentacao'], [/^supermerc/, 'mercado'], [/^saude/, 'saude'], [/^veicul/, 'transporte'],
  [/^vestuar/, 'compras'], [/^turismo/, 'viagem'], [/^educa/, 'educacao'], [/^hobby|^entreten/, 'lazer'],
  [/^moveis|^eletro|^lojas/, 'compras'], [/^servic/, 'servicos'], [/^divers/, 'outros'],
];

const MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
const MES3 = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];

/* ---------- utilidades ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const brl = (v) => (v == null || isNaN(v) ? '—' : v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }));
const r2 = (v) => Math.round(v * 100) / 100;
const pad = (n) => String(n).padStart(2, '0');
const mk = (y, m) => `${y}-${pad(m)}`;
const addM = (key, n) => { let [y, m] = key.split('-').map(Number); m += n; y += Math.floor((m - 1) / 12); m = (((m - 1) % 12) + 12) % 12 + 1; return mk(y, m); };
const diffM = (a, b) => { const [ya, ma] = a.split('-').map(Number), [yb, mb] = b.split('-').map(Number); return (yb - ya) * 12 + (mb - ma); };
const now = new Date();
const TODAY = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
const CUR = TODAY.slice(0, 7);
const dayIn = (key, d) => { const [y, m] = key.split('-').map(Number); const last = new Date(y, m, 0).getDate(); return `${key}-${pad(Math.min(Math.max(+d || 1, 1), last))}`; };
const mesNome = (key) => { const [y, m] = key.split('-').map(Number); return `${MESES[m - 1]} de ${y}`; };
const mesCurto = (key) => { const [y, m] = key.split('-').map(Number); return `${MES3[m - 1]}${y !== +CUR.slice(0, 4) ? '/' + String(y).slice(2) : ''}`; };
const dBR = (iso) => (iso ? `${iso.slice(8, 10)}/${iso.slice(5, 7)}` : '');
const daysBetween = (a, b) => Math.round((new Date(b + 'T12:00') - new Date(a + 'T12:00')) / 864e5);
const uid = () => Math.random().toString(36).slice(2, 9);
const clone = (o) => JSON.parse(JSON.stringify(o));
const strip = (s) => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '');
const mkey = (desc) => strip(desc).toUpperCase().replace(/\s+\d{1,2}\/\d{1,2}$/, '').replace(/\s+/g, ' ').trim();

/* ---------- estado ---------- */
const EMPTY = () => ({ cfg: { cards: [], bills: [], rules: {}, paid: {}, incomes: [], entradas: [], recebido: {}, gastos: [], metas: {}, conta: { saldo: null, em: null, cheque: null } }, faturas: {} });
const S = {
  data: EMPTY(),
  example: false,
  locked: true,
  lock: { mode: null, msg: '', busy: false, tries: 0, waitUntil: 0, forgot: false },
  loaded: false,
  mode: 'loading', // loading | conta | aparelho
  stale: false,
  month: CUR,
  view: 'resumo',
  fatId: null,
  selDay: null,
  catFilter: null,
  edit: null,
  confirm: null,
  pwd: null,
  importing: false,
  ai: { fn: null, busy: false },
  showPags: false,
  grpFilter: null,
  showAll: false,
  showParc: false,
};
let EX = null;
const D = () => (S.example ? EX : S.data);

/* ---------- categorização ---------- */
function categorize(t) {
  const k = mkey(t.desc);
  const rule = D().cfg.rules[k];
  if (rule) return { cat: rule.cat, src: rule.src || 'voce' };
  const up = strip(t.desc).toUpperCase() + ' ';
  for (const [re, c] of KEYWORDS) if (re.test(up)) return { cat: c, src: 'auto' };
  const h = strip(t.hint || '').toLowerCase();
  for (const [re, c] of HINTS) if (re.test(h)) return { cat: c, src: 'banco' };
  if (t.tipo === 'serv') return { cat: 'tarifas', src: 'auto' };
  return { cat: 'outros', src: 'auto' };
}

/* ---------- consultas ---------- */
const cards = () => D().cfg.cards;
const bills = () => D().cfg.bills;
const allFat = () => Object.values(D().faturas).sort((a, b) => (a.venc < b.venc ? 1 : -1));
const fatOfCard = (cid) => allFat().filter((f) => f.cardId === cid);
const cardById = (id) => cards().find((c) => c.id === id);
const cardName = (c) => (c ? c.nome || `${BANCOS[c.banco] || 'Cartão'}${c.final ? ' final ' + c.final : ''}` : 'Cartão');
const billActive = (b, M) => (!b.inicio || b.inicio <= M) && (!b.fim || M <= b.fim);
// conta fixa paga no cartão: se a fatura desse cartão já está no mês, a conta já está dentro dela (não conta de novo)
const billViaCard = (b, M) => !!b.cartao && fatOfCard(b.cartao).some((f) => f.venc.slice(0, 7) === M);
// conta de valor variável (água, luz): usa o valor lido da conta daquele mês; sem conta lida, estima pelo último valor
const billVal = (b, M) => (b.valores && b.valores[M] ? +b.valores[M].valor || 0 : +b.valor || 0);
const billDate = (b, M) => (b.valores && b.valores[M] && b.valores[M].venc) || dayIn(M, b.dia);
const billCounts = (b, M) => billActive(b, M) && !billViaCard(b, M);
const isPaid = (k) => !!D().cfg.paid[k];

function projection(cid, M) {
  // mesmo banco e mesmo final de cartão já com fatura importada no mês: não estima por cima
  const me = cardById(cid);
  if (me && me.final && cards().some((o) => o.id !== cid && o.banco === me.banco && o.final === me.final && allFat().some((g) => g.cardId === o.id && g.venc.slice(0, 7) === M))) return null;
  const f = fatOfCard(cid).find((x) => x.venc.slice(0, 7) < M);
  if (!f) return null;
  const k = diffM(f.venc.slice(0, 7), M);
  const items = Parser.projectFuture(f).filter((p) => p.k === k);
  return { from: f, items, total: r2(items.reduce((s, p) => s + p.v, 0)) };
}

/* fatura paga? marcação manual ou pagamento que aparece na fatura seguinte do mesmo cartão */
function fatPaidInfo(f) {
  const key = `c:${f.cardId}:${f.venc.slice(0, 7)}`;
  const manual = D().cfg.paid[key];
  if (manual) return { pago: true, key, data: typeof manual === 'string' ? manual : null, como: 'voce' };
  if ((f.total ?? 1) <= 0) return { pago: true, key, como: 'zerada' };
  const alvo = f.total ?? f.soma;
  for (const g of fatOfCard(f.cardId)) {
    if (g.venc <= f.venc) continue;
    const p = (g.pags || []).find((x) => Math.abs(-x.v - alvo) < 0.02 || (-x.v >= alvo - 0.02 && x.d >= f.emissao));
    if (p) return { pago: true, key, data: p.d, como: 'auto' };
  }
  return { pago: false, key };
}

function eventsOf(M) {
  const ev = [];
  for (const c of cards()) {
    if (!c.venc) continue;
    const date = dayIn(M, c.venc);
    const f = fatOfCard(c.id).find((x) => x.venc.slice(0, 7) === M);
    let valor = null, est = false, zerada = false, fid = null, date2 = date;
    let auto = null;
    if (f) { valor = f.total ?? f.soma; zerada = (f.total ?? 1) === 0; fid = f.id; date2 = f.venc; const pi = fatPaidInfo(f); if (pi.como === 'auto') auto = pi.data; }
    else { const p = projection(c.id, M); if (p && p.total > 0) { valor = p.total; est = true; } }
    ev.push({ key: `c:${c.id}:${M}`, kind: 'cartao', id: c.id, nome: `Fatura ${cardName(c)}`, banco: c.banco, date: date2, valor, est, zerada, fid, auto });
  }
  for (const b of bills()) if (billCounts(b, M)) ev.push({ key: `b:${b.id}:${M}`, kind: 'conta', id: b.id, nome: b.nome, cat: b.cat, date: billDate(b, M), valor: billVal(b, M), est: !!(b.variavel && !(b.valores && b.valores[M])) });
  for (const e of ev) {
    e.pago = isPaid(e.key) || e.zerada || !!e.auto;
    e.pagoEm = typeof D().cfg.paid[e.key] === 'string' ? D().cfg.paid[e.key] : e.auto || null;
    const d = daysBetween(TODAY, e.date);
    e.status = e.pago ? 'pago' : d < 0 ? 'atrasado' : d <= 3 ? 'logo' : 'aberto';
    e.dias = d;
  }
  return ev.sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : a.nome.localeCompare(b.nome)));
}

function spendingOf(M) {
  const tx = [];
  for (const f of allFat()) if (f.venc.slice(0, 7) === M) {
    for (const t of f.tx) tx.push({ ...t, ...categorize(t), fat: f });
    if (f.encargos > 0) tx.push({ d: f.venc, desc: 'Encargos (multa, mora, rotativo, IOF)', v: f.encargos, cat: 'tarifas', src: 'banco', fat: f, encargo: true });
  }
  const bl = bills().filter((b) => billCounts(b, M)).map((b) => ({ desc: b.nome, v: billVal(b, M), cat: b.cat || 'outros', conta: true }));
  const totTx = r2(tx.reduce((s, t) => s + t.v, 0));
  const totBl = r2(bl.reduce((s, t) => s + t.v, 0));
  const byCat = {};
  for (const t of [...tx, ...bl]) byCat[t.cat] = r2((byCat[t.cat] || 0) + t.v);
  const juros = r2(tx.reduce((s, t) => s + (t.juros || 0), 0) + tx.filter((t) => t.cat === 'tarifas' && !t.juros).reduce((s, t) => s + t.v, 0));
  const missing = cards().filter((c) => c.venc && !allFat().some((f) => f.cardId === c.id && f.venc.slice(0, 7) === M));
  return { tx, bl, totTx, totBl, total: r2(totTx + totBl), byCat, juros, missing };
}

function committed(M) {
  let parc = 0;
  for (const c of cards()) {
    const f = fatOfCard(c.id).find((x) => x.venc.slice(0, 7) === M);
    if (f) parc += f.tx.filter((t) => t.parc || /\bPA\/\d{2}\b/.test(t.desc)).reduce((s, t) => s + t.v, 0);
    else { const p = projection(c.id, M); if (p) parc += p.total; }
  }
  const fix = bills().filter((b) => billCounts(b, M)).reduce((s, b) => s + billVal(b, M), 0);
  return { parc: r2(parc), fix: r2(fix) };
}
