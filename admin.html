<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Painel · Economize</title>
<style>body{font:16px/1.5 system-ui,sans-serif;max-width:860px;margin:0 auto;padding:20px;background:#fbfaf7;color:#1c2b2a}h1{font-size:1.4rem}.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.c{background:#fff;border:1px solid #e3e0d6;border-radius:14px;padding:16px}.c b{display:block;font-size:2rem}input,button{font:inherit;padding:10px;border-radius:10px;border:1px solid #cfcabb;width:100%;box-sizing:border-box;margin:4px 0}button{background:#0f766e;color:#fff;border:0;cursor:pointer}table{width:100%;border-collapse:collapse;margin-top:16px;font-size:.92rem}td,th{text-align:left;padding:8px;border-bottom:1px solid #e3e0d6}.m{color:#a33}.s{color:#5b6b69}</style></head><body>
<h1>Painel do Economize</h1><div id="app"></div>
<script>
const U='https://rqnnuzspztkmjqmgrpes.supabase.co',K='sb_publishable_lnITinTjh7uDrMwfOLEMig_mq7uzaiu';
const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const d=s=>s?new Date(s).toLocaleDateString('pt-BR'):'—';
async function api(p,o,t){const r=await fetch(U+p,{...o,headers:{apikey:K,'Content-Type':'application/json',...(t?{Authorization:'Bearer '+t}:{})}});const j=await r.json().catch(()=>null);if(!r.ok)throw new Error((j&&(j.msg||j.message))||r.status);return j}
function login(m){app.innerHTML=`<form id="f"><p class="s">Acesso restrito ao administrador.</p><input id="e" type="email" placeholder="E-mail" required><input id="p" type="password" placeholder="Senha" required><p class="m">${esc(m||'')}</p><button>Entrar</button></form>`;
f.onsubmit=async ev=>{ev.preventDefault();try{const j=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:e.value,password:p.value})});painel(j.access_token)}catch(x){login('E-mail ou senha incorretos.')}}}
async function painel(t){try{const s=await api('/rest/v1/rpc/admin_stats',{method:'POST',body:'{}'},t);
app.innerHTML=`<div class="g"><div class="c"><b>${s.total}</b>usuários</div><div class="c"><b>${s.pro}</b>Pro</div><div class="c"><b>${s.ativos_7d}</b>ativos em 7 dias</div><div class="c"><b>${s.novos_7d}</b>novos em 7 dias</div></div>
<table><tr><th>E-mail</th><th>Plano</th><th>Criado</th><th>Último acesso</th></tr>${s.usuarios.map(u=>`<tr><td>${esc(u.email)}</td><td>${esc(u.plano)}</td><td>${d(u.criado)}</td><td>${d(u.ultimo)}</td></tr>`).join('')}</table>`}
catch(x){login('Esta conta não tem acesso ao painel.')}}
login();
</script></body></html>
