<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Painel · Economize</title>
<style>body{font:16px/1.5 system-ui,sans-serif;max-width:860px;margin:0 auto;padding:20px;background:#fbfaf7;color:#1c2b2a}h1{font-size:1.4rem}.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.c{background:#fff;border:1px solid #e3e0d6;border-radius:14px;padding:16px}.c b{display:block;font-size:2rem}input,button{font:inherit;padding:10px;border-radius:10px;border:1px solid #cfcabb;width:100%;box-sizing:border-box;margin:4px 0}button{background:#0f766e;color:#fff;border:0;cursor:pointer}table{width:100%;border-collapse:collapse;margin-top:16px;font-size:.92rem}td,th{text-align:left;padding:8px;border-bottom:1px solid #e3e0d6}.m{color:#a33}.s{color:#5b6b69}</style></head><body>
<h1>Painel do Economize</h1><div id="app"></div>
<script>
const U='https://rqnnuzspztkmjqmgrpes.supabase.co',K='sb_publishable_lnITinTjh7uDrMwfOLEMig_mq7uzaiu';
const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const d=s=>s?new Date(s).toLocaleDateString('pt-BR'):'—';
async function api(p,o,t){const r=await fetch(U+p,{...o,headers:{apikey:K,'Content-Type':'application/json',...(t?{Authorization:'Bearer '+t}:{})}});const j=await r.json().catch(()=>null);if(!r.ok)throw new Error((j&&(j.msg||j.message))||r.status);return j}
function login(m){app.innerHTML=`<form id="f"><p class="s">Acesso restrito ao administrador.</p><input id="e" type="email" placeholder="E-mail" required><input id="p" type="password" placeholder="Senha" required><p class="m">${esc(m||'')}</p><button>Entrar</button></form>`;
f.onsubmit=async ev=>{ev.preventDefault();try{const j=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:e.value,password:p.value})});painel(j.access_token)}catch(x){login('E-mail ou senha incorretos.')}}}
async function painel(t){try{const s=await api('/rest/v1/rpc/admin_stats',{method:'POST',body:'{}'},t);
app.innerHTML=`<div class="g"><div class="c"><b>${s.total}</b>usuários</div><div class="c"><b>${s.pro}</b>Pro</div><div class="c"><b>${s.ativos_7d}</b>ativos em 7 dias</div><div class="c"><b>${s.novos_7d}</b>novos em 7 dias</div></div>
<table><tr><th>E-mail</th><th>Plano</th><th>Criado</th><th>Último acesso</th></tr>${s.usuarios.map(u=>`<tr><td>${esc(u.email)}</td><td>${esc(u.plano)}</td><td>${d(u.criado)}</td><td>${d(u.ultimo)}</td></tr>`).join('')}</table><h2 style="font-size:1.1rem;margin-top:28px">Faturas para virar leitor fixo</h2><div id="pend"><p class="s">Carregando…</p></div>`;pendentes(t)}
catch(x){login('Esta conta não tem acesso ao painel.')}}

async function pendentes(t){const box=document.getElementById('pend');try{const r=await api('/rest/v1/rpc/admin_pendentes',{method:'POST',body:'{}'},t);const R=r.resumo;
const it=r.itens.map(i=>`<details style="border:1px solid #d8d4c8;border-radius:10px;padding:8px 12px;margin:8px 0"><summary><b>${esc(i.banco||'?')}</b> · ${esc(i.motivo)} · ${i.confere?'IA conferiu':'IA não conferiu'} · ${i.n_tx} lanç. · R$ ${Number(i.total||0).toFixed(2)} · ${d(i.criado_em)} · <i>${esc(i.status)}</i></summary>
<p class="s">Tokens: ${i.tokens_in??'—'} entrada / ${i.tokens_out??'—'} saída</p>
<p><button data-id="${i.id}" data-s="em_analise">Em análise</button> <button data-id="${i.id}" data-s="resolvida">Resolvida</button> <button data-id="${i.id}" data-del="1">Apagar</button> <button data-copy="${i.id}">Copiar texto</button></p>
<pre id="tx${i.id}" style="white-space:pre-wrap;max-height:300px;overflow:auto;font-size:12px;background:#f1efe6;padding:8px;border-radius:8px">${esc(i.texto_mascarado)}</pre></details>`).join('');
box.innerHTML=`<div class="g"><div class="c"><b>${R.total}</b>casos</div><div class="c"><b>${R.novas}</b>novos</div><div class="c"><b>${R.tokens_in}</b>tokens entrada</div><div class="c"><b>${R.tokens_out}</b>tokens saída</div></div>
<table><tr><th>Banco</th><th>Casos</th><th>IA conferiu</th></tr>${r.por_banco.map(b=>`<tr><td>${esc(b.banco)}</td><td>${b.n}</td><td>${b.confere}</td></tr>`).join('')}</table>${it||'<p class="s">Nenhum caso ainda.</p>'}`;
box.onclick=async ev=>{const b=ev.target.closest('button');if(!b)return;try{if(b.dataset.copy){await navigator.clipboard.writeText(document.getElementById('tx'+b.dataset.copy).textContent);b.textContent='Copiado';return}
if(b.dataset.del){if(!confirm('Apagar este caso? Não dá para desfazer.'))return;await api('/rest/v1/rpc/admin_pendente_apagar',{method:'POST',body:JSON.stringify({p_id:Number(b.dataset.id)})},t)}else{await api('/rest/v1/rpc/admin_pendente_status',{method:'POST',body:JSON.stringify({p_id:Number(b.dataset.id),p_status:b.dataset.s})},t)}pendentes(t)}catch(x){b.textContent='Erro'}}}
catch(x){box.innerHTML='<p class="m">Não consegui carregar os casos.</p>'}}
login();
</script></body></html>
